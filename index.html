<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ま～るタイプ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background-color: #0f1020;
      color: #e0e6ed;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 35px rgba(255, 107, 129, 0.3), 0 0 15px rgba(0, 0, 0, 0.8);
      border: 3px solid #ff6b81;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      cursor: crosshair;
    }
    canvas {
      display: block;
      background-color: #0f1020;
      image-rendering: pixelated;
    }
    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
    }
    #ui-overlay-buttons {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      gap: 6px;
    }
    .game-btn {
      background: rgba(84, 160, 255, 0.2);
      border: 2px solid #54a0ff;
      color: #54a0ff;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .game-btn:active {
      background: #54a0ff;
      color: #fff;
    }
    #config-panel {
      display: none;
      position: absolute;
      top: 60px;
      left: 20px;
      background: rgba(15, 16, 32, 0.96);
      border: 2px solid #54a0ff;
      padding: 14px;
      border-radius: 10px;
      z-index: 25;
      color: #fff;
      font-size: 13px;
      box-shadow: 0 0 20px rgba(84, 160, 255, 0.4);
    }
    .cfg-row {
      margin-bottom: 8px;
    }
    .cfg-btn {
      background: #54a0ff;
      color: #000;
      border: none;
      padding: 2px 8px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 4px;
    }
    #instructions {
      margin-top: 10px;
      font-size: 12px;
      color: #ff9ff3;
      text-align: center;
      line-height: 1.5;
      letter-spacing: 0.5px;
    }
    #instructions span {
      color: #54a0ff;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="ui-overlay-buttons">
    <button class="game-btn" id="cfgBtn">⚙ 調整</button>
    <button class="game-btn" id="godBtn">GOD: OFF</button>
  </div>

  <div id="config-panel">
    <div style="font-weight:bold; margin-bottom:10px; color:#ff9ff3;">⚙ 数値調整モード</div>
    <div class="cfg-row">
      湧き間隔 (Spawn): <span id="val-spawn">70</span>
      <button class="cfg-btn" onclick="adjustParam('spawn', -15)">-</button>
      <button class="cfg-btn" onclick="adjustParam('spawn', 15)">+</button>
    </div>
    <div class="cfg-row">
      敵スピード (Speed): <span id="val-speed">0.92</span>
      <button class="cfg-btn" onclick="adjustParam('speed', -0.1)">-</button>
      <button class="cfg-btn" onclick="adjustParam('speed', 0.1)">+</button>
    </div>
    <div style="text-align: right; margin-top: 10px;">
      <button class="game-btn" onclick="toggleConfigPanel()">閉じる</button>
    </div>
  </div>

  <canvas id="gameCanvas" width="640" height="640"></canvas>
  <div class="scanlines"></div>
</div>

<div id="instructions">
  移動: <span>WASD / 矢印キー</span> | 発射・回収: <span>Space / Enter / 左右クリック</span> (スマホ: <span>左ドラッグ</span> / <span>右タップ</span>)
</div>

<audio id="bgmAudio" src="Ravel-Borelo.mp3" loop preload="auto" playsinline></audio>

<script>
// ============================================================================
// 1. 調整用パラメータ定義 (CONFIG)
// ============================================================================
const CONFIG = {
  CANVAS_WIDTH: 640,
  CANVAS_HEIGHT: 640,
  
  SCROLL_SPEED: 0.45,
  
  PLAYER_MAX_HP: 5,
  PLAYER_RADIUS: 70,
  PLAYER_SPEED: 3.2,
  
  FORCE_RADIUS: 22,
  FORCE_LAUNCH_SPEED: 7.2,
  FORCE_RETURN_SPEED: 7.2,
  FORCE_BOUNCE_OFFSET: 15,
  FORCE_DAMAGE_FRAME: 2.2,
  FORCE_DAMAGE_BODY: 0.8,
  
  ENEMY_RADIUS: 18,
  FLYER_SPEED_BASE: 0.92,
  
  BOSS_CORE_CYCLE: 160,
  BOSS_CORE_OPEN_TIME: 90,
  BOSS_PART_HP: 3000,
  
  MASTER_VOLUME: 0.22,
  
  COLOR_BG: "#0f1020",
  COLOR_PLAYER: "#e0e6ed",
  COLOR_PLAYER_CORE: "#54a0ff",
  COLOR_IRON_LIGHT: "#eceff1",
  COLOR_IRON_BASE: "#78909c",
  COLOR_IRON_DARK: "#37474f",
  COLOR_HUD_TEXT: "#54a0ff"
};

let spawnIntervalSetting = 70;

function toggleConfigPanel() {
  const panel = document.getElementById("config-panel");
  panel.style.display = panel.style.display === "none" ? "block" : "none";
}

function adjustParam(type, amount) {
  if (type === 'spawn') {
    spawnIntervalSetting = Math.max(20, Math.min(300, spawnIntervalSetting + amount));
    document.getElementById("val-spawn").textContent = spawnIntervalSetting;
  } else if (type === 'speed') {
    CONFIG.FLYER_SPEED_BASE = Math.max(0.2, Math.min(3.0, Math.round((CONFIG.FLYER_SPEED_BASE + amount) * 100) / 100));
    document.getElementById("val-speed").textContent = CONFIG.FLYER_SPEED_BASE;
  }
}

document.getElementById("cfgBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  toggleConfigPanel();
});

// ============================================================================
// 2. 音響・BGMシステム
// ============================================================================
class SoundSystem {
  constructor() {
    this.ctx = null;
    this.bgmAudio = null;
  }

  getBgm() {
    if (!this.bgmAudio) {
      this.bgmAudio = document.getElementById("bgmAudio");
    }
    return this.bgmAudio;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        this.ctx = new AudioCtx();
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
    this.playBGM();
  }

  playBGM() {
    const bgm = this.getBgm();
    if (bgm) {
      bgm.volume = 0.35;
      const p = bgm.play();
      if (p !== undefined) {
        p.catch(err => {
          console.warn("BGM auto-play deferred:", err);
        });
      }
    }
  }

  stopBGM() {
    const bgm = this.getBgm();
    if (bgm) {
      bgm.pause();
      bgm.currentTime = 0;
    }
  }

  playLaunch() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(520, t);
    osc.frequency.exponentialRampToValueAtTime(110, t + 0.16);
    gain.gain.setValueAtTime(CONFIG.MASTER_VOLUME * 0.9, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.16);
  }

  playDock() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc1 = this.ctx.createOscillator();
    const gain1 = this.ctx.createGain();
    osc1.type = 'square';
    osc1.frequency.setValueAtTime(880, t);
    osc1.frequency.exponentialRampToValueAtTime(440, t + 0.05);
    gain1.gain.setValueAtTime(CONFIG.MASTER_VOLUME * 0.6, t);
    gain1.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    osc1.connect(gain1);
    gain1.connect(this.ctx.destination);
    osc1.start(t);
    osc1.stop(t + 0.05);
  }

  playGet() {
    if (!this.ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      const t = this.ctx.currentTime + idx * 0.045;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(CONFIG.MASTER_VOLUME * 0.8, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.12);
    });
  }

  playClearJingle() {
    if (!this.ctx) return;
    const baseTime = this.ctx.currentTime;
    const melody = [
      { f: 523.25, d: 0.12, t: 0.0 },
      { f: 659.25, d: 0.12, t: 0.12 },
      { f: 783.99, d: 0.12, t: 0.24 },
      { f: 1046.50, d: 0.24, t: 0.36 },
      { f: 880.00, d: 0.14, t: 0.60 },
      { f: 1046.50, d: 0.14, t: 0.74 },
      { f: 1174.66, d: 0.14, t: 0.88 },
      { f: 1318.51, d: 1.8, t: 1.05 }
    ];

    melody.forEach(note => {
      const startTime = baseTime + note.t;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(note.f, startTime);
      gain.gain.setValueAtTime(CONFIG.MASTER_VOLUME * 1.2, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + note.d);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + note.d);
    });

    [523.25, 659.25, 783.99, 1046.50].forEach(freq => {
      const startTime = baseTime + 1.05;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(CONFIG.MASTER_VOLUME * 0.9, startTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 2.4);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + 2.4);
    });
  }

  playEnemyDestroy() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const bufferSize = this.ctx.sampleRate * 0.15;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1000, t);
    filter.frequency.exponentialRampToValueAtTime(120, t + 0.14);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(CONFIG.MASTER_VOLUME * 1.1, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start(t);
    noise.stop(t + 0.15);
  }

  playPlayerDamage() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, t);
    osc.frequency.exponentialRampToValueAtTime(60, t + 0.2);
    gain.gain.setValueAtTime(CONFIG.MASTER_VOLUME * 1.3, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.2);
  }

  playPlayerDeath() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const bufferSize = this.ctx.sampleRate * 0.8;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(600, t);
    filter.frequency.exponentialRampToValueAtTime(50, t + 0.75);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(CONFIG.MASTER_VOLUME * 1.8, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.75);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start(t);
    noise.stop(t + 0.8);
  }

  playPierceTick() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(700 + Math.random() * 200, t);
    osc.frequency.exponentialRampToValueAtTime(200, t + 0.03);
    gain.gain.setValueAtTime(CONFIG.MASTER_VOLUME * 0.45, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.03);
  }
}

const sounds = new SoundSystem();

const unlockAudioHandler = () => {
  sounds.init();
  window.removeEventListener('click', unlockAudioHandler);
  window.removeEventListener('keydown', unlockAudioHandler);
  window.removeEventListener('touchstart', unlockAudioHandler);
};
window.addEventListener('click', unlockAudioHandler);
window.addEventListener('keydown', unlockAudioHandler);
window.addEventListener('touchstart', unlockAudioHandler);

// ============================================================================
// 3. ゲーム本体変数・オブジェクト
// ============================================================================
const container = document.getElementById("game-container");
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const godBtn = document.getElementById("godBtn");

const stars = Array.from({ length: 70 }, () => ({
  x: Math.random() * CONFIG.CANVAS_WIDTH,
  y: Math.random() * CONFIG.CANVAS_HEIGHT,
  speed: 0.15 + Math.random() * 0.5,
  size: 1 + Math.random() * 2.0,
  alpha: 0.3 + Math.random() * 0.7
}));

let currentWave = 1;
let waveState = "PLAYING";
let restTimer = 0;
let waveAnnouncementTimer = 0;
let waveAnnouncementText = "";

let gameState = "TITLE";
let pauseMenuSelection = 0;
let scrollX = 0;
let stageLength = 4800;
let gameFrame = 0;
let nextSpawnDelay = 60;
let squadSpawnCounter = 0;
let creditFrame = 0;

let wave1SpawnedCount = 0;
let wave1PostTimer = 0;
let carrierCounter = 0;
let bossAlertTriggered = false;

let isInvincible = false;

function toggleGodMode() {
  isInvincible = !isInvincible;
  godBtn.textContent = isInvincible ? "GOD: ON" : "GOD: OFF";
  godBtn.style.borderColor = isInvincible ? "#ff6b81" : "#54a0ff";
  godBtn.style.color = isInvincible ? "#ff6b81" : "#54a0ff";
  addFloatingText(player.x, player.y - 35, isInvincible ? "INVINCIBLE ON" : "INVINCIBLE OFF");
}

godBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  sounds.init();
  toggleGodMode();
});

let particles = [];
let floatingTexts = [];
let enemies = [];
let droppedItems = [];
let squads = [];
let enemyBullets = [];

const player = {
  x: 120,
  y: 320,
  vx: 0,
  vy: 0,
  hp: CONFIG.PLAYER_MAX_HP,
  maxHp: CONFIG.PLAYER_MAX_HP,
  invincibleTimer: 0,
  radius: CONFIG.PLAYER_RADIUS,
  isDead: false,
  flameAnim: 0,
  speedBonus: 0
};

let forces = [];

const boss = {
  isActive: false,
  isDying: false,
  deathTimer: 0,
  x: CONFIG.CANVAS_WIDTH + 180,
  y: 320,
  moveDir: -1,
  eyeHp: CONFIG.BOSS_PART_HP,
  eyeMaxHp: CONFIG.BOSS_PART_HP,
  tailHp: CONFIG.BOSS_PART_HP,
  tailMaxHp: CONFIG.BOSS_PART_HP,
  timer: 0,
  isCoreOpen: false,
  legAnim: 0,
  radius: 95,
  moveAngle: 0
};

const keys = {
  up: false, down: false, left: false, right: false,
  action: false
};

let leftTouchId = null;
let leftTouchStartX = 0;
let leftTouchStartY = 0;
let playerStartX = 0;
let playerStartY = 0;
let touchActive = false;

let rightTouchId = null;
let rightTouchStartX = 0;
let rightTouchStartY = 0;
let rightTouchMoved = false;

// ============================================================================
// 4. 入力管理（Ctrlキー完全ブロック版）
// ============================================================================
container.addEventListener("contextmenu", e => e.preventDefault());

function triggerGameAction() {
  sounds.init();
  if (gameState === "TITLE") {
    startGame();
    return;
  }
  if (gameState === "GAMEOVER") {
    startGame();
    return;
  }
  if (gameState === "CREDITS") {
    if (creditFrame >= 300) {
      sounds.stopBGM();
      gameState = "TITLE";
    }
    return;
  }
  if (gameState === "PAUSE") {
    if (pauseMenuSelection === 0) {
      gameState = "PLAYING";
      sounds.playBGM();
    } else {
      sounds.stopBGM();
      gameState = "TITLE";
    }
    return;
  }
  handleForceAction();
}

container.addEventListener("mousedown", (e) => {
  if (e.target.closest('#config-panel') || e.target === godBtn || e.target.id === 'cfgBtn') return;
  e.preventDefault();
  window.focus();
  if (e.button === 0 || e.button === 2) {
    triggerGameAction();
  }
});

canvas.addEventListener("touchstart", (e) => {
  sounds.init();
  if (gameState === "TITLE" || gameState === "GAMEOVER" || (gameState === "CREDITS" && creditFrame >= 300)) {
    e.preventDefault();
    triggerGameAction();
    return;
  }
  if (gameState === "CREDITS" && creditFrame < 300) {
    e.preventDefault();
    return;
  }
  if (gameState === "PAUSE") {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const scaleY = canvas.height / rect.height;
    const ty = (e.changedTouches[0].clientY - rect.top) * scaleY;
    if (ty < 340) pauseMenuSelection = 0;
    else pauseMenuSelection = 1;
    triggerGameAction();
    return;
  }

  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const tx = (t.clientX - rect.left) * scaleX;
    const ty = (t.clientY - rect.top) * scaleY;

    if (tx < CONFIG.CANVAS_WIDTH / 2) {
      if (leftTouchId === null) {
        leftTouchId = t.identifier;
        leftTouchStartX = tx;
        leftTouchStartY = ty;
        playerStartX = player.x;
        playerStartY = player.y;
        touchActive = true;
      }
    } else {
      if (rightTouchId === null) {
        rightTouchId = t.identifier;
        rightTouchStartX = tx;
        rightTouchStartY = ty;
        rightTouchMoved = false;
      }
    }
  }
}, { passive: false });

canvas.addEventListener("touchmove", (e) => {
  if (gameState !== "PLAYING") return;

  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const tx = (t.clientX - rect.left) * scaleX;
    const ty = (t.clientY - rect.top) * scaleY;

    if (t.identifier === leftTouchId) {
      const dx = tx - leftTouchStartX;
      const dy = ty - leftTouchStartY;
      const targetX = Math.max(player.radius, Math.min(CONFIG.CANVAS_WIDTH - player.radius, playerStartX + dx));
      const targetY = Math.max(player.radius, Math.min(CONFIG.CANVAS_HEIGHT - player.radius, playerStartY + dy));
      
      player.vx = targetX - player.x;
      player.vy = targetY - player.y;
      player.x = targetX;
      player.y = targetY;
      touchActive = true;
    } else if (t.identifier === rightTouchId) {
      const dist = Math.hypot(tx - rightTouchStartX, ty - rightTouchStartY);
      if (dist > 14) rightTouchMoved = true;
    }
  }
}, { passive: false });

canvas.addEventListener("touchend", (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === leftTouchId) {
      leftTouchId = null;
      touchActive = false;
      player.vx = 0;
      player.vy = 0;
    } else if (t.identifier === rightTouchId) {
      if (!rightTouchMoved && gameState === "PLAYING") {
        e.preventDefault();
        handleForceAction();
      }
      rightTouchId = null;
    }
  }
}, { passive: false });

canvas.addEventListener("touchcancel", (e) => {
  leftTouchId = null;
  rightTouchId = null;
  touchActive = false;
  player.vx = 0;
  player.vy = 0;
}, { passive: false });

function isUpKey(e) {
  return e.code === "KeyW" || e.code === "ArrowUp" || (e.key && e.key.toLowerCase() === "w");
}
function isDownKey(e) {
  return e.code === "KeyS" || e.code === "ArrowDown" || (e.key && e.key.toLowerCase() === "s");
}
function isLeftKey(e) {
  return e.code === "KeyA" || e.code === "ArrowLeft" || (e.key && e.key.toLowerCase() === "a");
}
function isRightKey(e) {
  return e.code === "KeyD" || e.code === "ArrowRight" || (e.key && e.key.toLowerCase() === "d");
}

function isActionKey(e) {
  return e.code === "Space" || e.code === "Enter" || e.code === "NumpadEnter";
}

window.addEventListener("keydown", (e) => {
  // 💡Ctrlキー、Cmdキー、Shiftキーなどが押されている場合は絶対にゲーム操作をしない（即リターン）
  if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || 
      e.code.includes("Control") || e.code.includes("Shift") || e.code.includes("Alt") || e.code.includes("Meta") ||
      e.key === "Control" || e.key === "Shift" || e.key === "Alt" || e.key === "Meta") {
    return;
  }

  let handled = false;
  sounds.init();

  if (e.code === "Escape" || (e.key || "").toLowerCase() === "escape") {
    if (gameState === "PLAYING") {
      gameState = "PAUSE";
      sounds.stopBGM();
      pauseMenuSelection = 0;
      handled = true;
    } else if (gameState === "PAUSE") {
      gameState = "PLAYING";
      sounds.playBGM();
      handled = true;
    }
  }

  if (gameState === "PAUSE") {
    if (isUpKey(e) || isDownKey(e)) {
      pauseMenuSelection = 1 - pauseMenuSelection;
      handled = true;
    }
    if (isActionKey(e)) {
      if (pauseMenuSelection === 1) {
        sounds.stopBGM();
        gameState = "TITLE";
      } else {
        gameState = "PLAYING";
        sounds.playBGM();
      }
      handled = true;
    }
    if (handled) { e.preventDefault(); return; }
  }

  if (gameState === "CREDITS" && creditFrame < 300) {
    e.preventDefault();
    return;
  }

  if (gameState === "TITLE" || gameState === "GAMEOVER" || gameState === "CREDITS") {
    if (isActionKey(e)) {
      triggerGameAction();
      handled = true;
    }
  } else {
    if (isUpKey(e)) { keys.up = true; handled = true; }
    if (isDownKey(e)) { keys.down = true; handled = true; }
    if (isLeftKey(e)) { keys.left = true; handled = true; }
    if (isRightKey(e)) { keys.right = true; handled = true; }

    if (e.code === "KeyI" || (e.key || "").toLowerCase() === "i") {
      toggleGodMode();
      handled = true;
    } else if (isActionKey(e)) {
      if (!keys.action && gameState === "PLAYING") {
        handleForceAction();
      }
      keys.action = true;
      handled = true;
    }
  }

  if (handled) e.preventDefault();
});

window.addEventListener("keyup", (e) => {
  if (isUpKey(e)) keys.up = false;
  if (isDownKey(e)) keys.down = false;
  if (isLeftKey(e)) keys.left = false;
  if (isRightKey(e)) keys.right = false;
  if (isActionKey(e)) keys.action = false;
});

// ============================================================================
// 5. ステージ初期化＆開始
// ============================================================================
function createForceObject(id, parentType, parentId, contactAngle) {
  return {
    id: id,
    state: "ATTACHED",
    parentType: parentType,
    parentId: parentId,
    contactAngle: contactAngle,
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    radius: CONFIG.FORCE_RADIUS,
    rollAngle: 0
  };
}

function startGame() {
  currentWave = 1;
  waveState = "PLAYING";
  restTimer = 0;
  gameFrame = 0;
  scrollX = 0;
  nextSpawnDelay = 40;
  squadSpawnCounter = 0;
  wave1SpawnedCount = 0;
  wave1PostTimer = 0;
  carrierCounter = 0;
  bossAlertTriggered = false;
  particles = [];
  floatingTexts = [];
  enemies = [];
  droppedItems = [];
  squads = [];
  enemyBullets = [];

  player.x = 120;
  player.y = 320;
  player.hp = CONFIG.PLAYER_MAX_HP;
  player.maxHp = CONFIG.PLAYER_MAX_HP;
  player.invincibleTimer = 0;
  player.speedBonus = 0;
  player.isDead = false;

  boss.eyeHp = boss.eyeMaxHp = CONFIG.BOSS_PART_HP;
  boss.tailHp = boss.tailMaxHp = CONFIG.BOSS_PART_HP;
  boss.x = CONFIG.CANVAS_WIDTH + 180;
  boss.y = 320;
  boss.moveDir = -1;
  boss.isActive = false;
  boss.isDying = false;
  boss.deathTimer = 0;
  boss.timer = 0;
  boss.isCoreOpen = false;

  triggerAnnouncement("WAVE 1");

  forces = [];
  const initialAngle = 0;
  const initialForce = createForceObject(1, "PLAYER", null, initialAngle);
  forces.push(initialForce);

  updateAllForcePositions();
  sounds.playBGM();
  gameState = "PLAYING";
}

function triggerAnnouncement(text) {
  waveAnnouncementText = text;
  waveAnnouncementTimer = 100;
}

// ============================================================================
// 6. 鉄球フォース制御
// ============================================================================
function handleForceAction() {
  if (player.isDead || gameState !== "PLAYING") return;

  const attachedForces = forces.filter(f => f.state === "ATTACHED").sort((a, b) => a.id - b.id);

  if (attachedForces.length > 0) {
    const targetForce = attachedForces[0];
    targetForce.state = "LAUNCHING";

    const dirX = Math.cos(targetForce.contactAngle);
    const dirY = Math.sin(targetForce.contactAngle);

    targetForce.vx = dirX * CONFIG.FORCE_LAUNCH_SPEED;
    targetForce.vy = dirY * CONFIG.FORCE_LAUNCH_SPEED;

    sounds.playLaunch();
    createExplosion(targetForce.x, targetForce.y, CONFIG.COLOR_IRON_LIGHT, 8);
    addFloatingText(targetForce.x, targetForce.y - 14, `LAUNCH #${targetForce.id}`);
  } else {
    let anyReturning = false;
    forces.forEach(f => {
      if (f.state !== "ATTACHED") {
        f.state = "RETURNING";
        anyReturning = true;
      }
    });
    if (anyReturning) {
      sounds.playLaunch();
      addFloatingText(player.x, player.y - 30, "RECALL ALL");
    }
  }
}

function updateAllForcePositions() {
  const attached = forces.filter(f => f.state === "ATTACHED").sort((a, b) => a.id - b.id);
  const groups = {};

  attached.forEach(f => {
    let matchedKey = null;
    for (let key in groups) {
      const angleVal = parseFloat(key);
      let diff = Math.abs(f.contactAngle - angleVal);
      while (diff > Math.PI) diff = Math.abs(diff - Math.PI * 2);
      if (diff < 0.35) {
        matchedKey = key;
        break;
      }
    }

    if (matchedKey === null) {
      matchedKey = f.contactAngle.toString();
      groups[matchedKey] = [];
    }
    groups[matchedKey].push(f);
  });

  Object.entries(groups).forEach(([key, group]) => {
    const angleVal = parseFloat(key);
    group.sort((a, b) => a.id - b.id);
    group.forEach((f, idx) => {
      f.contactAngle = angleVal;
      const dist = player.radius + f.radius + (idx * (f.radius * 2));
      f.x = player.x + Math.cos(angleVal) * dist;
      f.y = player.y + Math.sin(angleVal) * dist;
    });
  });
}

function updateForces() {
  forces.forEach(f => {
    f.rollAngle += (f.state === "ATTACHED" ? 0.02 : (f.state === "STAYING" ? 0.03 : 0.08));

    if (f.state === "LAUNCHING") {
      f.x += f.vx;
      f.y += f.vy;

      let hitBoundary = false;

      if (f.x > CONFIG.CANVAS_WIDTH - f.radius) {
        f.x = CONFIG.CANVAS_WIDTH - f.radius - CONFIG.FORCE_BOUNCE_OFFSET;
        hitBoundary = true;
      } else if (f.x < f.radius) {
        f.x = f.radius + CONFIG.FORCE_BOUNCE_OFFSET;
        hitBoundary = true;
      }
      if (f.y > CONFIG.CANVAS_HEIGHT - f.radius) {
        f.y = CONFIG.CANVAS_HEIGHT - f.radius - CONFIG.FORCE_BOUNCE_OFFSET;
        hitBoundary = true;
      } else if (f.y < f.radius) {
        f.y = f.radius + CONFIG.FORCE_BOUNCE_OFFSET;
        hitBoundary = true;
      }

      if (hitBoundary) {
        f.state = "STAYING";
        f.vx = 0;
        f.vy = 0;
        createExplosion(f.x, f.y, CONFIG.COLOR_IRON_LIGHT, 6);
        addFloatingText(f.x, f.y - 14, `STAY #${f.id}`);
      }
    } else if (f.state === "STAYING" || f.state === "RETURNING") {
      if (f.state === "RETURNING") {
        const dx = player.x - f.x;
        const dy = player.y - f.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 4) {
          f.x += (dx / dist) * CONFIG.FORCE_RETURN_SPEED;
          f.y += (dy / dist) * CONFIG.FORCE_RETURN_SPEED;
        }
      }

      const distToPlayer = Math.hypot(player.x - f.x, player.y - f.y);
      if (distToPlayer <= player.radius + f.radius + 6) {
        f.parentType = "PLAYER";
        f.parentId = null;
        f.contactAngle = Math.atan2(f.y - player.y, f.x - player.x);
        f.state = "ATTACHED";
        sounds.playDock();
        createExplosion(f.x, f.y, CONFIG.COLOR_IRON_LIGHT, 10);
        addFloatingText(f.x, f.y - 16, `DOCK #${f.id}`);
      }
    }
  });

  updateAllForcePositions();
}

// ============================================================================
// 7. 6ウェーブ制 ＆ アイテム・敵管理
// ============================================================================
function updateSquadSpawning() {
  if (boss.isActive || gameState !== "PLAYING") return;

  const progressRatio = scrollX / stageLength;
  
  if (currentWave === 1 && wave1SpawnedCount >= 3) {
    wave1PostTimer++;
    if (wave1PostTimer > 60 || enemies.length === 0) {
      scrollX = stageLength * 0.16;
      triggerWaveRest(2);
    }
  }

  let targetWave = 1;
  if (progressRatio >= 0.16 && progressRatio < 0.33) targetWave = 2;
  else if (progressRatio >= 0.33 && progressRatio < 0.50) targetWave = 3;
  else if (progressRatio >= 0.50 && progressRatio < 0.66) targetWave = 4;
  else if (progressRatio >= 0.66 && progressRatio < 0.83) targetWave = 5;
  else if (progressRatio >= 0.83 && progressRatio < 0.96) targetWave = 6;

  if (progressRatio >= 0.96 && !bossAlertTriggered) {
    bossAlertTriggered = true;
    triggerAnnouncement("BOSS ALERT !!");
  }

  if (currentWave !== targetWave && currentWave < targetWave) {
    if (waveState === "PLAYING") {
      triggerWaveRest(targetWave);
    }
  }

  if (waveState === "REST") {
    restTimer--;
    if (restTimer <= 0) {
      waveState = "PLAYING";
      nextSpawnDelay = 15;
      triggerAnnouncement(`WAVE ${currentWave}`);
    }
    return;
  }

  if (currentWave === 1) {
    if (wave1SpawnedCount < 3) {
      nextSpawnDelay--;
      if (nextSpawnDelay <= 0) {
        nextSpawnDelay = 130;
        let enemyType = "NORMAL";
        if (wave1SpawnedCount === 0 || wave1SpawnedCount === 1) {
          enemyType = "FORCE_CARRIER";
        }
        squads.push({
          id: Date.now() + Math.random(),
          total: 10,
          remaining: 10,
          lastSpawnFrame: gameFrame,
          spawnedCount: 0,
          startX: CONFIG.CANVAS_WIDTH + 24,
          startY: 120 + Math.random() * (CONFIG.CANVAS_HEIGHT - 240),
          patternType: "STRAIGHT",
          enemyType: enemyType
        });
        wave1SpawnedCount++;
      }
    }
  } else {
    let effectiveDelay = spawnIntervalSetting;
    if (currentWave === 2) effectiveDelay = 200;
    else if (currentWave === 3) effectiveDelay = 260;
    else if (currentWave === 4) effectiveDelay = 240;
    else if (currentWave === 5) effectiveDelay = 220;
    else if (currentWave >= 6) effectiveDelay = 200;

    nextSpawnDelay--;
    if (nextSpawnDelay <= 0) {
      nextSpawnDelay = effectiveDelay;
      squadSpawnCounter++;

      const squadId = Date.now() + Math.random();
      let patternType = "WAVE_BIG";
      let startX = CONFIG.CANVAS_WIDTH + 24;
      let startY = 120 + Math.random() * (CONFIG.CANVAS_HEIGHT - 240);

      const randPattern = Math.random();
      if (currentWave === 3) {
        if (randPattern < 0.6) {
          startX = 120 + Math.random() * (CONFIG.CANVAS_WIDTH - 240);
          startY = -24;
          patternType = "VERTICAL_DOWN";
        } else {
          patternType = "STRAIGHT";
        }
      } else if (currentWave === 4) {
        if (randPattern < 0.6) {
          startX = 120 + Math.random() * (CONFIG.CANVAS_WIDTH - 240);
          startY = CONFIG.CANVAS_HEIGHT + 24;
          patternType = "VERTICAL_UP";
        } else {
          patternType = "STRAIGHT";
        }
      } else if (currentWave === 5) {
        if (randPattern < 0.5) {
          startX = 120 + Math.random() * (CONFIG.CANVAS_WIDTH - 240);
          startY = -24;
          patternType = "VERTICAL_DOWN";
        } else {
          startX = 120 + Math.random() * (CONFIG.CANVAS_WIDTH - 240);
          startY = CONFIG.CANVAS_HEIGHT + 24;
          patternType = "VERTICAL_UP";
        }
      } else if (currentWave === 6) {
        const randDir = Math.random();
        if (randDir < 0.35) { startX = CONFIG.CANVAS_WIDTH + 24; startY = Math.random() * CONFIG.CANVAS_HEIGHT; patternType = "WAVE_BIG"; }
        else if (randDir < 0.68) { startX = 100 + Math.random() * (CONFIG.CANVAS_WIDTH - 200); startY = -24; patternType = "VERTICAL_DOWN"; }
        else { startX = 100 + Math.random() * (CONFIG.CANVAS_WIDTH - 200); startY = CONFIG.CANVAS_HEIGHT + 24; patternType = "VERTICAL_UP"; }
      } else {
        patternType = randPattern < 0.4 ? "STRAIGHT" : (Math.random() < 0.5 ? "WAVE_BIG" : "WAVE_SMALL");
      }

      let enemyType = "NORMAL";
      if (currentWave >= 4) {
        const r = Math.random();
        if (r < 0.65) {
          enemyType = "FORCE_CARRIER";
        } else {
          carrierCounter++;
          if (carrierCounter % 4 === 0) {
            enemyType = "SPEED_CARRIER";
          }
        }
      } else if (currentWave >= 2) {
        const r = Math.random();
        if (r < 0.14) {
          enemyType = "FORCE_CARRIER";
        } else {
          carrierCounter++;
          if (carrierCounter % 4 === 0) {
            enemyType = "SPEED_CARRIER";
          }
        }
      }

      const squadTotal = 5;

      squads.push({
        id: squadId,
        total: squadTotal,
        remaining: squadTotal,
        lastSpawnFrame: gameFrame,
        spawnedCount: 0,
        startX: startX,
        startY: startY,
        patternType: patternType,
        enemyType: enemyType
      });
    }
  }

  for (let s of squads) {
    const delay = 22;
    if (s.spawnedCount < s.total && (gameFrame - s.lastSpawnFrame) >= delay) {
      s.lastSpawnFrame = gameFrame;
      s.spawnedCount++;

      enemies.push({
        squadId: s.id,
        isSquadMember: true,
        x: s.startX,
        y: s.startY,
        baseX: s.startX,
        baseY: s.startY,
        patternType: s.patternType,
        enemyType: s.enemyType,
        hpVal: s.enemyType !== "NORMAL" ? 3.0 : 2.0,
        radius: s.enemyType !== "NORMAL" ? 21 : CONFIG.ENEMY_RADIUS
      });
    }
  }

  squads = squads.filter(s => s.remaining > 0);
}

function triggerWaveRest(nextWaveNum) {
  waveState = "REST";
  restTimer = 70;
  currentWave = nextWaveNum;
  triggerAnnouncement(`REST / WAVE ${nextWaveNum}`);
}

function applyPlayerDamage() {
  if (player.isDead || isInvincible || player.invincibleTimer > 0 || boss.isDying) return;
  
  player.hp--;
  player.invincibleTimer = 90;
  sounds.playPlayerDamage();
  createExplosion(player.x, player.y, "#ff4757", 12);
  addFloatingText(player.x, player.y - 45, `HIT! HP: ${player.hp}/${player.maxHp}`);

  if (player.hp <= 0) {
    killPlayer();
  }
}

function updateEnemies() {
  updateSquadSpawning();
  const currentSpeed = CONFIG.FLYER_SPEED_BASE;

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];

    if (e.patternType === "WAVE_BIG") {
      e.x -= currentSpeed * 1.2;
      e.y = e.baseY + Math.sin((CONFIG.CANVAS_WIDTH - e.x) * 0.035) * 95;
    } else if (e.patternType === "WAVE_SMALL") {
      e.x -= currentSpeed * 1.4;
      e.y = e.baseY + Math.sin((CONFIG.CANVAS_WIDTH - e.x) * 0.05) * 32;
    } else if (e.patternType === "STRAIGHT") {
      e.x -= currentSpeed * 1.6;
    } else if (e.patternType === "VERTICAL_DOWN") {
      e.y += currentSpeed * 1.3;
      e.x = e.baseX + Math.sin(e.y * 0.03) * 90;
    } else if (e.patternType === "VERTICAL_UP") {
      e.y -= currentSpeed * 1.3;
      e.x = e.baseX + Math.sin((CONFIG.CANVAS_HEIGHT - e.y) * 0.03) * 90;
    }

    if (e.x < -120 || e.x > CONFIG.CANVAS_WIDTH + 120 || e.y > CONFIG.CANVAS_HEIGHT + 120 || e.y < -120) {
      enemies.splice(i, 1);
      continue;
    }

    for (let f of forces) {
      const distToForce = Math.hypot(e.x - f.x, e.y - f.y);
      if (distToForce < f.radius + e.radius) {
        e.hpVal -= 2.5;
        createExplosion(e.x, e.y, CONFIG.COLOR_IRON_LIGHT, 4);
        if (e.hpVal <= 0) {
          destroyEnemy(i, e);
          break;
        }
      }
    }

    const distToPlayer = Math.hypot(e.x - player.x, e.y - player.y);
    if (distToPlayer < player.radius + e.radius - 8) {
      applyPlayerDamage();
      break;
    }
  }

  for (let a = 0; a < droppedItems.length; a++) {
    for (let b = a + 1; b < droppedItems.length; b++) {
      const itemA = droppedItems[a];
      const itemB = droppedItems[b];
      const dx = itemB.x - itemA.x;
      const dy = itemB.y - itemA.y;
      const dist = Math.hypot(dx, dy);
      const minDist = itemA.radius + itemB.radius + 8;

      if (dist < minDist && dist > 0.001) {
        const overlap = (minDist - dist) / 2;
        const nx = dx / dist;
        const ny = dy / dist;
        itemA.x -= nx * overlap;
        itemA.y -= ny * overlap;
        itemB.x += nx * overlap;
        itemB.y += ny * overlap;
      }
    }
  }

  for (let i = droppedItems.length - 1; i >= 0; i--) {
    const item = droppedItems[i];
    
    if (item.stage === "DASHING") {
      const dx = item.targetX - item.x;
      const dy = item.targetY - item.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 5) {
        item.x += (dx / dist) * 18.0;
        item.y += (dy / dist) * 18.0;
      } else {
        item.stage = "SCROLLING";
      }
    } else {
      item.x -= CONFIG.SCROLL_SPEED;
    }

    if (item.x < -60 || item.x > CONFIG.CANVAS_WIDTH + 60) {
      droppedItems.splice(i, 1);
      continue;
    }

    const distToPlayer = Math.hypot(item.x - player.x, item.y - player.y);
    if (distToPlayer < player.radius + item.radius + 6) {
      if (item.itemType === "SPEED_UP") {
        player.speedBonus = Math.min(2.5, player.speedBonus + 0.4);
        sounds.playGet();
        createExplosion(item.x, item.y, "#ffe600", 25);
        addFloatingText(player.x, player.y - 50, "SPEED UP !!");
      } else {
        const newId = forces.length + 1;
        const newForce = createForceObject(newId, "PLAYER", null, Math.PI);
        newForce.x = item.x;
        newForce.y = item.y;
        newForce.state = "RETURNING";
        forces.push(newForce);

        sounds.playGet();
        createExplosion(item.x, item.y, "#54a0ff", 30);
        addFloatingText(player.x, player.y - 50, `FORCE GET !! (#${newId})`);
      }
      droppedItems.splice(i, 1);
    }
  }

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx;
    b.y += b.vy;

    if (b.x < -30 || b.x > CONFIG.CANVAS_WIDTH + 30 || b.y < -30 || b.y > CONFIG.CANVAS_HEIGHT + 30) {
      enemyBullets.splice(i, 1);
      continue;
    }

    let blocked = false;
    for (let f of forces) {
      if (Math.hypot(b.x - f.x, b.y - f.y) < f.radius + b.radius + 2) {
        blocked = true;
        createExplosion(b.x, b.y, "#54a0ff", 3);
        if (gameFrame % 4 === 0) sounds.playPierceTick();
        break;
      }
    }

    if (blocked) {
      enemyBullets.splice(i, 1);
      continue;
    }

    if (Math.hypot(b.x - player.x, b.y - player.y) < player.radius + b.radius - 6) {
      applyPlayerDamage();
      enemyBullets.splice(i, 1);
      break;
    }
  }
}

function destroyEnemy(index, e) {
  sounds.playEnemyDestroy();
  createExplosion(e.x, e.y, e.enemyType !== "NORMAL" ? "#2ed573" : "#ff6b81", 16);

  if (e.isSquadMember) {
    const squad = squads.find(s => s.id === e.squadId);
    if (squad) {
      squad.remaining--;
      if (squad.remaining <= 0) {
        const targetEdgeX = 350 + Math.random() * 220;
        const targetEdgeY = 60 + Math.random() * (CONFIG.CANVAS_HEIGHT - 120);

        if (e.enemyType === "FORCE_CARRIER") {
          const nextNum = forces.length + 1;
          droppedItems.push({
            x: e.x + (Math.random() - 0.5) * 20,
            y: e.y + (Math.random() - 0.5) * 20,
            targetX: targetEdgeX,
            targetY: targetEdgeY,
            stage: "DASHING",
            itemType: "FORCE",
            nextId: nextNum,
            radius: CONFIG.FORCE_RADIUS
          });
          sounds.playGet();
          addFloatingText(e.x, e.y - 24, `FORCE DROP #${nextNum}!`);
        } else if (e.enemyType === "SPEED_CARRIER") {
          droppedItems.push({
            x: e.x + (Math.random() - 0.5) * 20,
            y: e.y + (Math.random() - 0.5) * 20,
            targetX: targetEdgeX,
            targetY: targetEdgeY,
            stage: "DASHING",
            itemType: "SPEED_UP",
            radius: CONFIG.FORCE_RADIUS
          });
          sounds.playGet();
          addFloatingText(e.x, e.y - 24, "SPEED UP DROP!");
        }
      }
    }
  }

  enemies.splice(index, 1);
}

// ============================================================================
// 8. 巨大ボス戦
// ============================================================================
function updateBoss() {
  if (!boss.isActive && scrollX >= stageLength) {
    boss.isActive = true;
    sounds.playGet();
  }

  if (!boss.isActive) return;

  if (boss.isDying) {
    boss.deathTimer--;
    if (gameFrame % 3 === 0) {
      sounds.playEnemyDestroy();
      const ex = boss.x + (Math.random() - 0.5) * 220;
      const ey = boss.y + (Math.random() - 0.5) * 180;
      createExplosion(ex, ey, Math.random() < 0.5 ? "#ff6b81" : "#ffe600", 6);
    }
    if (boss.deathTimer <= 0) {
      for (let i = 0; i < 140; i++) {
        createExplosion(boss.x + (Math.random()-0.5)*260, boss.y + (Math.random()-0.5)*220, "#ff4757", 5);
        createExplosion(boss.x + (Math.random()-0.5)*260, boss.y + (Math.random()-0.5)*220, "#ffe600", 5);
      }
      boss.isActive = false;
      sounds.stopBGM();
      gameState = "CREDITS";
      creditFrame = 0;
    }
    return;
  }

  boss.timer++;
  boss.legAnim += 0.015;

  boss.moveAngle += 0.003125;
  boss.y = 320 + Math.sin(boss.moveAngle) * 150;

  boss.x += boss.moveDir * 0.35;
  if (boss.x <= 180) {
    boss.x = 180;
    boss.moveDir = 1;
  } else if (boss.x >= CONFIG.CANVAS_WIDTH - 140) {
    boss.x = CONFIG.CANVAS_WIDTH - 140;
    boss.moveDir = -1;
  }

  const bossDrawX = boss.x;
  const bossDrawY = boss.y;
  
  const coreX = bossDrawX - 45;
  const coreY = bossDrawY;

  const tailTipX = bossDrawX + 85 + 4 * 45 + Math.sin(boss.legAnim + 4 * Math.PI / 2) * 20;
  const tailTipY = bossDrawY + Math.sin(boss.legAnim + 4 * 0.8) * 60;

  if (boss.timer % 45 === 0) {
    if (boss.eyeHp > 0) {
      const angleToPlayer = Math.atan2(player.y - coreY, player.x - coreX);
      for (let offset of [-0.5, -0.25, 0, 0.25, 0.5]) {
        enemyBullets.push({
          x: coreX,
          y: coreY,
          vx: Math.cos(angleToPlayer + offset) * 3.2,
          vy: Math.sin(angleToPlayer + offset) * 3.2,
          radius: 6
        });
      }
    }
    if (boss.tailHp > 0) {
      const angleToPlayer = Math.atan2(player.y - tailTipY, player.x - tailTipX);
      for (let offset of [-0.4, -0.15, 0.15, 0.4]) {
        enemyBullets.push({
          x: tailTipX,
          y: tailTipY,
          vx: Math.cos(angleToPlayer + offset) * 3.0,
          vy: Math.sin(angleToPlayer + offset) * 3.0,
          radius: 6
        });
      }
    }
  }

  const cycleFrame = boss.timer % CONFIG.BOSS_CORE_CYCLE;
  boss.isCoreOpen = (cycleFrame > (CONFIG.BOSS_CORE_CYCLE - CONFIG.BOSS_CORE_OPEN_TIME));

  forces.forEach(f => {
    if (boss.eyeHp > 0) {
      const distToEye = Math.hypot(f.x - coreX, f.y - coreY);
      if (distToEye < 38 + f.radius) {
        const dmg = boss.isCoreOpen ? CONFIG.FORCE_DAMAGE_FRAME * 2.2 : CONFIG.FORCE_DAMAGE_BODY * 0.5;
        boss.eyeHp -= dmg;
        if (gameFrame % 3 === 0) sounds.playPierceTick();
        createExplosion(coreX + (Math.random()-0.5)*25, coreY + (Math.random()-0.5)*25, "#ff6b81", 3);
        if (boss.eyeHp <= 0) {
          boss.eyeHp = 0;
          sounds.playEnemyDestroy();
          createExplosion(coreX, coreY, "#ffffff", 40);
          addFloatingText(coreX, coreY - 30, "EYE DESTROYED !!");
        }
      }
    }

    if (boss.tailHp > 0) {
      const distToTail = Math.hypot(f.x - tailTipX, f.y - tailTipY);
      if (distToTail < 38 + f.radius) {
        const dmg = boss.isCoreOpen ? CONFIG.FORCE_DAMAGE_FRAME * 2.2 : CONFIG.FORCE_DAMAGE_BODY * 0.5;
        boss.tailHp -= dmg;
        if (gameFrame % 3 === 0) sounds.playPierceTick();
        createExplosion(tailTipX + (Math.random()-0.5)*25, tailTipY + (Math.random()-0.5)*25, "#ff6b81", 3);
        if (boss.tailHp <= 0) {
          boss.tailHp = 0;
          sounds.playEnemyDestroy();
          createExplosion(tailTipX, tailTipY, "#ffffff", 40);
          addFloatingText(tailTipX, tailTipY - 30, "TAIL EYE DESTROYED !!");
        }
      }
    }
  });

  if (boss.eyeHp <= 0 && boss.tailHp <= 0) {
    triggerBossDefeat();
  }

  if (Math.hypot(player.x - bossDrawX, player.y - bossDrawY) < player.radius + boss.radius - 20) {
    applyPlayerDamage();
  }
}

function triggerBossDefeat() {
  if (boss.isDying) return;
  boss.isDying = true;
  boss.deathTimer = 180;
  enemyBullets = [];
  sounds.stopBGM();
  sounds.playClearJingle();
  addFloatingText(CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2, "BOSS DESTROYED !!");
}

function killPlayer() {
  if (player.isDead) return;
  player.isDead = true;
  sounds.playEnemyDestroy();
  sounds.stopBGM();
  sounds.playPlayerDeath();
  
  for (let i = 0; i < 4; i++) {
    setTimeout(() => {
      createExplosion(player.x + (Math.random()-0.5)*40, player.y + (Math.random()-0.5)*40, "#ff6b81", 20);
    }, i * 400);
  }

  gameState = "DYING";
  deathTimer = 180;
}

// ============================================================================
// 9. 自機移動＆スクロール更新
// ============================================================================
function movePlayer() {
  let moveX = 0, moveY = 0;
  if (keys.up) moveY -= 1;
  if (keys.down) moveY += 1;
  if (keys.left) moveX -= 1;
  if (keys.right) moveX += 1;

  if (moveX !== 0 && moveY !== 0) {
    moveX *= 0.7071;
    moveY *= 0.7071;
  }

  const actualSpeed = CONFIG.PLAYER_SPEED + player.speedBonus;

  if (!touchActive) {
    player.vx = moveX * actualSpeed;
    player.vy = moveY * actualSpeed;
    player.x += player.vx;
    player.y += player.vy;
  }

  player.x = Math.max(player.radius, Math.min(CONFIG.CANVAS_WIDTH - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(CONFIG.CANVAS_HEIGHT - player.radius, player.y));
  
  if (Math.abs(player.vx) > 0.1 || Math.abs(player.vy) > 0.1) {
    player.flameAnim = (player.flameAnim + 0.3) % (Math.PI * 2);
  }
}

function updateScroll() {
  if (!boss.isActive) {
    scrollX += CONFIG.SCROLL_SPEED;
  }
}

function createExplosion(x, y, color = "#ff6b81", count = 15) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.8 + Math.random() * 3.5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 2 + Math.random() * 4,
      color: color,
      alpha: 1.0,
      decay: 0.025 + Math.random() * 0.03
    });
  }
}

function addFloatingText(x, y, text) {
  floatingTexts.push({ x, y, text, alpha: 1.0, vy: -0.8 });
}

function update() {
  gameFrame++;

  if (player.invincibleTimer > 0) {
    player.invincibleTimer--;
  }

  if (waveAnnouncementTimer > 0) {
    waveAnnouncementTimer--;
  }

  if (gameState === "CREDITS") {
    creditFrame++;
  }

  stars.forEach(s => {
    s.x -= s.speed + 0.15;
    if (s.x < 0) { s.x = CONFIG.CANVAS_WIDTH; s.y = Math.random() * CONFIG.CANVAS_HEIGHT; }
  });

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy; ft.alpha -= 0.015;
    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
  }

  if (gameState === "DYING") {
    deathTimer--;
    if (deathTimer <= 0) gameState = "GAMEOVER";
    return;
  }

  if (gameState !== "PLAYING") return;

  updateScroll();
  movePlayer();
  updateForces();
  updateEnemies();
  updateBoss();
}

// ============================================================================
// 10. 描画処理 (Render)
// ============================================================================
function drawPlayer(x, y) {
  if (player.isDead && gameState !== "DYING") return;
  
  if (player.invincibleTimer > 0 && Math.floor(player.invincibleTimer / 4) % 2 === 0) {
    return;
  }

  ctx.save();
  ctx.translate(x, y);

  if (gameState !== "DYING") {
    let moveAngle = Math.PI;
    const speedSq = player.vx * player.vx + player.vy * player.vy;
    if (speedSq > 0.01) {
      moveAngle = Math.atan2(player.vy, player.vx) + Math.PI;
    }

    const flameLen = 18 + Math.sin(player.flameAnim) * 8;
    ctx.save();
    ctx.rotate(moveAngle);
    ctx.fillStyle = "#ff6b81";
    ctx.beginPath();
    ctx.moveTo(player.radius - 4, -12);
    ctx.lineTo(player.radius + flameLen, 0);
    ctx.lineTo(player.radius - 4, 12);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  let playerColor = CONFIG.COLOR_PLAYER;
  if (isInvincible) {
    playerColor = (Math.floor(gameFrame / 8) % 2 === 0) ? "#ff9ff3" : "#54a0ff";
  } else if (gameState === "DYING") {
    const flashBlink = Math.floor(deathTimer / 12) % 2 === 0;
    playerColor = flashBlink ? "#ff0000" : "#ffffff";
  }

  ctx.fillStyle = playerColor;
  ctx.beginPath();
  ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
  ctx.fill();

  if (gameState !== "DYING") {
    ctx.fillStyle = CONFIG.COLOR_PLAYER_CORE;
    ctx.beginPath();
    ctx.arc(15, 0, player.radius * 0.45, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#ff9ff3";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, player.radius - 6, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
}

function drawForce(f) {
  ctx.save();
  ctx.translate(f.x, f.y);

  if (f.state === "STAYING") {
    ctx.fillStyle = "rgba(84, 160, 255, 0.22)";
    ctx.beginPath();
    ctx.arc(0, 0, f.radius + 7, 0, Math.PI * 2);
    ctx.fill();
  }

  const grad = ctx.createRadialGradient(
    -f.radius * 0.35, -f.radius * 0.35, f.radius * 0.1,
    0, 0, f.radius
  );
  grad.addColorStop(0, CONFIG.COLOR_IRON_LIGHT);
  grad.addColorStop(0.5, CONFIG.COLOR_IRON_BASE);
  grad.addColorStop(1, CONFIG.COLOR_IRON_DARK);

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, f.radius, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#ff6b81";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, f.radius * 0.7, f.rollAngle, f.rollAngle + Math.PI * 1.5);
  ctx.stroke();

  ctx.fillStyle = "#ffffff";
  ctx.shadowColor = "#000000";
  ctx.shadowBlur = 3;
  ctx.font = "bold 14px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(f.id.toString(), 0, 1);
  ctx.shadowBlur = 0;

  ctx.restore();
}

function drawEnemies() {
  enemies.forEach(e => {
    ctx.save();
    ctx.translate(e.x, e.y);

    if (e.enemyType === "FORCE_CARRIER") {
      ctx.fillStyle = "#2ed573";
      ctx.beginPath();
      ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ff6b81";
      ctx.beginPath();
      ctx.arc(0, 0, e.radius * 0.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (e.enemyType === "SPEED_CARRIER") {
      ctx.fillStyle = "#ffe600";
      ctx.beginPath();
      ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ff6b81";
      ctx.beginPath();
      ctx.arc(0, 0, e.radius * 0.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = "#ff9ff3";
      ctx.beginPath();
      ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#2d3436";
      ctx.beginPath();
      ctx.arc(-5, 0, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  });

  droppedItems.forEach(item => {
    ctx.save();
    ctx.translate(item.x, item.y);

    const flash = (Math.sin(gameFrame * 0.3) + 1) / 2;
    const isSpeed = item.itemType === "SPEED_UP";

    if (isSpeed) {
      const glowRadius = item.radius + 12 + flash * 8;
      const auraGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, glowRadius);
      auraGrad.addColorStop(0, "#ffffff");
      auraGrad.addColorStop(0.4, "#ffe600");
      auraGrad.addColorStop(1, "rgba(255, 230, 0, 0)");
      ctx.fillStyle = auraGrad;
      ctx.beginPath();
      ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 9px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("SPEED", 0, 1);
    } else {
      const glowRadius = item.radius + 12 + flash * 8;
      const auraGrad = ctx.createRadialGradient(0, 0, item.radius, 0, 0, glowRadius);
      auraGrad.addColorStop(0, "rgba(84, 160, 255, 0.8)");
      auraGrad.addColorStop(1, "rgba(84, 160, 255, 0)");
      ctx.fillStyle = auraGrad;
      ctx.beginPath();
      ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
      ctx.fill();

      const grad = ctx.createRadialGradient(-6, -6, 2, 0, 0, item.radius);
      grad.addColorStop(0, "#ffffff");
      grad.addColorStop(0.6, CONFIG.COLOR_IRON_BASE);
      grad.addColorStop(1, CONFIG.COLOR_IRON_DARK);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, item.radius + 2, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = "#54a0ff";
      ctx.font = "bold 13px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(`+${item.nextId}`, 0, 1);
    }

    ctx.restore();
  });

  enemyBullets.forEach(b => {
    ctx.save();
    ctx.fillStyle = "#ff4757";
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  });

  function drawBossEye(x, y, isOpen, hp) {
    ctx.save();
    if (hp <= 0) {
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(x, y, 36, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#747d8c";
      ctx.lineWidth = 3;
      ctx.stroke();
    } else {
      if (isOpen) {
        ctx.fillStyle = "#ff6b81";
        ctx.shadowColor = "#ff6b81";
        ctx.shadowBlur = 24;
        ctx.beginPath();
        ctx.arc(x, y, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(x, y, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#2f3542";
        ctx.beginPath();
        ctx.arc(x, y, 10, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = "#3f37c9";
        ctx.beginPath();
        ctx.arc(x, y, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#54a0ff";
        ctx.lineWidth = 4;
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  if (boss.isActive) {
    const bossDrawX = boss.x;
    const bossDrawY = boss.y;

    ctx.save();
    ctx.translate(bossDrawX, bossDrawY);

    if (boss.isDying) {
      const flash = Math.floor(boss.deathTimer / 4) % 2 === 0;
      ctx.fillStyle = flash ? "#ffffff" : "#ff4757";
    } else {
      ctx.fillStyle = "#7209b7";
    }

    ctx.beginPath();
    ctx.ellipse(40, 0, 125, 105, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#ff6b81";
    ctx.lineWidth = 4;
    ctx.stroke();

    for (let i = 1; i <= 4; i++) {
      const legAngle = boss.legAnim + (i * Math.PI / 2);
      const tailX = 85 + i * 45 + Math.sin(legAngle) * 20;
      const tailY = Math.sin(boss.legAnim + i * 0.8) * 60;
      
      if (boss.isDying) {
        const flash = Math.floor(boss.deathTimer / 4) % 2 === 0;
        ctx.fillStyle = flash ? "#ffe600" : "#ffffff";
      } else {
        ctx.fillStyle = "#ff9ff3";
      }

      ctx.beginPath();
      ctx.arc(tailX, tailY, 42 - i * 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#3a0ca3";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    const coreX = -45;
    const coreY = 0;
    const tailTipX = 85 + 4 * 45 + Math.sin(boss.legAnim + 4 * Math.PI / 2) * 20;
    const tailTipY = Math.sin(boss.legAnim + 4 * 0.8) * 60;

    drawBossEye(coreX, coreY, boss.isCoreOpen, boss.eyeHp);
    drawBossEye(tailTipX, tailTipY, boss.isCoreOpen, boss.tailHp);

    ctx.restore();
  }
}

function drawHUD() {
  ctx.save();
  ctx.fillStyle = "rgba(15, 16, 32, 0.95)";
  ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, 56);
  ctx.strokeStyle = "#ff6b81";
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, CONFIG.CANVAS_WIDTH, 56);

  for (let h = 0; h < player.maxHp; h++) {
    const iconX = 26 + h * 34;
    const iconY = 28;
    ctx.save();
    if (h < player.hp) {
      ctx.fillStyle = CONFIG.COLOR_PLAYER;
      ctx.beginPath();
      ctx.arc(iconX, iconY, 13, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = CONFIG.COLOR_PLAYER_CORE;
      ctx.beginPath();
      ctx.arc(iconX + 3, iconY, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#ff9ff3";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(iconX, iconY, 11, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.strokeStyle = "rgba(255, 107, 129, 0.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(iconX, iconY, 13, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  if (boss.isActive && !boss.isDying) {
    const eyeRatio = Math.max(0, boss.eyeHp / boss.eyeMaxHp);
    const tailRatio = Math.max(0, boss.tailHp / boss.tailMaxHp);
    
    ctx.fillStyle = "#ff6b81";
    ctx.font = "bold 13px monospace";
    ctx.fillText("EYE 1", 370, 22);
    ctx.strokeStyle = "#ff6b81";
    ctx.lineWidth = 2;
    ctx.strokeRect(420, 10, 100, 15);
    ctx.fillRect(421, 11, 98 * eyeRatio, 13);

    ctx.fillStyle = "#54a0ff";
    ctx.fillText("EYE 2", 370, 46);
    ctx.strokeStyle = "#54a0ff";
    ctx.lineWidth = 2;
    ctx.strokeRect(420, 34, 100, 15);
    ctx.fillRect(421, 35, 98 * tailRatio, 13);
  }

  ctx.restore();
}

function drawOverlay() {
  ctx.save();
  ctx.textAlign = "center";

  if (waveAnnouncementTimer > 0 && gameState === "PLAYING") {
    ctx.save();
    ctx.fillStyle = "rgba(15, 16, 32, 0.85)";
    ctx.fillRect(0, 220, CONFIG.CANVAS_WIDTH, 160);
    ctx.strokeStyle = waveAnnouncementText.includes("ALERT") ? "#ff4757" : "#ff6b81";
    ctx.lineWidth = 4;
    ctx.strokeRect(0, 220, CONFIG.CANVAS_WIDTH, 160);

    ctx.fillStyle = waveAnnouncementText.includes("ALERT") ? "#ff4757" : "#ffe600";
    ctx.shadowColor = "#ff9ff3";
    ctx.shadowBlur = 25;
    ctx.font = "bold 52px monospace";
    ctx.fillText(waveAnnouncementText, CONFIG.CANVAS_WIDTH / 2, 315);
    ctx.restore();
  }

  if (gameState === "TITLE") {
    ctx.fillStyle = "rgba(15, 16, 32, 0.95)";
    ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

    ctx.save();
    ctx.fillStyle = "#ff6b81";
    ctx.shadowColor = "#ff9ff3";
    ctx.shadowBlur = 35;
    ctx.font = "900 86px monospace";
    ctx.fillText("ま～るタイプ", CONFIG.CANVAS_WIDTH / 2, 175);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3;
    ctx.strokeText("ま～るタイプ", CONFIG.CANVAS_WIDTH / 2, 175);
    ctx.restore();

    ctx.save();
    const illustX = CONFIG.CANVAS_WIDTH / 2 - 25;
    const illustY = 265;
    
    const flameLen = 16 + Math.sin(Date.now() * 0.015) * 6;
    ctx.fillStyle = "#ff6b81";
    ctx.beginPath();
    ctx.moveTo(illustX - 38, illustY - 10);
    ctx.lineTo(illustX - 38 - flameLen, illustY);
    ctx.lineTo(illustX - 38, illustY + 10);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = CONFIG.COLOR_PLAYER;
    ctx.beginPath();
    ctx.arc(illustX, illustY, 38, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = CONFIG.COLOR_PLAYER_CORE;
    ctx.beginPath();
    ctx.arc(illustX + 8, illustY, 16, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#ff9ff3";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(illustX, illustY, 34, 0, Math.PI * 2);
    ctx.stroke();

    const forceIllustX = illustX + 68;
    const forceIllustY = illustY;
    const grad = ctx.createRadialGradient(
      forceIllustX - 5, forceIllustY - 5, 2,
      forceIllustX, forceIllustY, 15
    );
    grad.addColorStop(0, CONFIG.COLOR_IRON_LIGHT);
    grad.addColorStop(0.5, CONFIG.COLOR_IRON_BASE);
    grad.addColorStop(1, CONFIG.COLOR_IRON_DARK);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(forceIllustX, forceIllustY, 15, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#ff6b81";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(forceIllustX, forceIllustY, 10, 0, Math.PI * 1.5);
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 11px monospace";
    ctx.fillText("1", forceIllustX, forceIllustY + 4);
    ctx.restore();

    ctx.fillStyle = "#ff6b81";
    ctx.beginPath();
    ctx.roundRect(CONFIG.CANVAS_WIDTH / 2 - 160, 345, 320, 56, 28);
    ctx.fill();
    ctx.strokeStyle = "#ffe600";
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 20px monospace";
    ctx.fillText("▶ ゲーム開始 / スタート", CONFIG.CANVAS_WIDTH / 2, 380);

    ctx.fillStyle = "#e0e6ed";
    ctx.font = "bold 13px monospace";
    ctx.fillText("移動: WASD  発射/回収: Spaceキー", CONFIG.CANVAS_WIDTH / 2, 445);
    
    ctx.fillStyle = "#8395a7";
    ctx.font = "12px monospace";
    ctx.fillText("（スマホ: 左ドラッグで移動 / 右タップで発射・回収）", CONFIG.CANVAS_WIDTH / 2, 475);
    ctx.fillText("・緑: 鉄球追加 / 黄: SPEED UP / 紫: 通常敵", CONFIG.CANVAS_WIDTH / 2, 502);

    const blink = Math.floor(Date.now() / 400) % 2 === 0;
    if (blink) {
      ctx.fillStyle = "#ffe600";
      ctx.font = "bold 16px monospace";
      ctx.fillText("[ SPACE / ENTER / CLICK TO PLAY ]", CONFIG.CANVAS_WIDTH / 2, 565);
    }
  } else if (gameState === "PAUSE") {
    ctx.fillStyle = "rgba(15, 16, 32, 0.88)";
    ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

    ctx.fillStyle = "#54a0ff";
    ctx.font = "bold 42px monospace";
    ctx.fillText("PAUSE", CONFIG.CANVAS_WIDTH / 2, 200);

    ctx.fillStyle = pauseMenuSelection === 0 ? "#ffe600" : "#ffffff";
    ctx.font = "bold 22px monospace";
    ctx.fillText(pauseMenuSelection === 0 ? "▶ ゲームに戻る" : "  ゲームに戻る", CONFIG.CANVAS_WIDTH / 2, 310);

    ctx.fillStyle = pauseMenuSelection === 1 ? "#ffe600" : "#ffffff";
    ctx.font = "bold 22px monospace";
    ctx.fillText(pauseMenuSelection === 1 ? "▶ タイトル画面に戻る" : "  タイトル画面に戻る", CONFIG.CANVAS_WIDTH / 2, 380);

    ctx.fillStyle = "#ff9ff3";
    ctx.font = "14px monospace";
    ctx.fillText("[ ESCキー または タップ/Spaceで決定 ]", CONFIG.CANVAS_WIDTH / 2, 480);
  } else if (gameState === "GAMEOVER") {
    ctx.fillStyle = "rgba(35, 10, 15, 0.9)";
    ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

    ctx.fillStyle = "#ff6b81";
    ctx.font = "bold 38px monospace";
    ctx.fillText("GAME OVER", CONFIG.CANVAS_WIDTH / 2, 270);

    ctx.fillStyle = "#54a0ff";
    ctx.font = "bold 20px monospace";
    ctx.fillText("RETRY", CONFIG.CANVAS_WIDTH / 2, 340);

    const blink = Math.floor(Date.now() / 350) % 2 === 0;
    if (blink) {
      ctx.fillStyle = "#ffe66d";
      ctx.font = "bold 16px monospace";
      ctx.fillText("[ SPACE / ENTER / CLICK TO RETRY ]", CONFIG.CANVAS_WIDTH / 2, 450);
    }
  } else if (gameState === "CREDITS") {
    ctx.fillStyle = "rgba(10, 20, 35, 0.96)";
    ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

    ctx.fillStyle = "#2ed573";
    ctx.font = "bold 48px monospace";
    ctx.fillText("Congratirations!!", CONFIG.CANVAS_WIDTH / 2, 200);

    ctx.fillStyle = "#ffe600";
    ctx.font = "bold 26px monospace";
    ctx.fillText("Thank you for playing!", CONFIG.CANVAS_WIDTH / 2, 290);

    ctx.fillStyle = "#54a0ff";
    ctx.font = "bold 24px monospace";
    ctx.fillText("Created by mukkii", CONFIG.CANVAS_WIDTH / 2, 380);

    if (creditFrame >= 300) {
      const blink = Math.floor(Date.now() / 400) % 2 === 0;
      if (blink) {
        ctx.fillStyle = "#ffe600";
        ctx.font = "bold 20px monospace";
        ctx.fillText("- PRESS SPACE / ENTER / CLICK -", CONFIG.CANVAS_WIDTH / 2, 500);
      }
    }
  }

  ctx.restore();
}

function render() {
  ctx.fillStyle = CONFIG.COLOR_BG;
  ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
  stars.forEach(s => {
    ctx.fillStyle = `rgba(200, 225, 255, ${s.alpha})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });

  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  });
  ctx.globalAlpha = 1.0;

  floatingTexts.forEach(ft => {
    ctx.save();
    ctx.fillStyle = `rgba(255, 230, 109, ${ft.alpha})`;
    ctx.font = "bold 13px monospace";
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  });

  drawEnemies();
  drawPlayer(player.x, player.y);
  forces.forEach(f => drawForce(f));
  drawHUD();
  drawOverlay();
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
