<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ま～るタイプ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background-color: #0f1020;
      color: #e0e6ed;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 35px rgba(255, 107, 129, 0.3), 0 0 15px rgba(0, 0, 0, 0.8);
      border: 3px solid #ff6b81;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      cursor: crosshair;
    }
    canvas {
      display: block;
      background-color: #0f1020;
      image-rendering: pixelated;
    }
    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
    }
    #ui-overlay-buttons {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 10;
      display: flex;
      gap: 6px;
    }
    .game-btn {
      background: rgba(84, 160, 255, 0.2);
      border: 2px solid #54a0ff;
      color: #54a0ff;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .game-btn:active {
      background: #54a0ff;
      color: #fff;
    }
    #config-panel {
      display: none;
      position: absolute;
      top: 60px;
      left: 20px;
      background: rgba(15, 16, 32, 0.96);
      border: 2px solid #54a0ff;
      padding: 14px;
      border-radius: 10px;
      z-index: 25;
      color: #fff;
      font-size: 13px;
      box-shadow: 0 0 20px rgba(84, 160, 255, 0.4);
    }
    .cfg-row {
      margin-bottom: 8px;
    }
    .cfg-btn {
      background: #54a0ff;
      color: #000;
      border: none;
      padding: 2px 8px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 4px;
    }
    #instructions {
      margin-top: 10px;
      font-size: 12px;
      color: #ff9ff3;
      text-align: center;
      line-height: 1.5;
      letter-spacing: 0.5px;
    }
    #instructions span {
      color: #54a0ff;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="ui-overlay-buttons">
    <button class="game-btn" id="cfgBtn">⚙ 調整</button>
    <button class="game-btn" id="godBtn">GOD: OFF</button>
  </div>

  <div id="config-panel">
    <div style="font-weight:bold; margin-bottom:10px; color:#ff9ff3;">⚙ 数値調整モード</div>
    <div class="cfg-row">
      湧き間隔 (Spawn): <span id="val-spawn">70</span>
      <button class="cfg-btn" onclick="adjustParam('spawn', -15)">-</button>
      <button class="cfg-btn" onclick="adjustParam('spawn', 15)">+</button>
    </div>
    <div class="cfg-row">
      敵スピード (Speed): <span id="val-speed">1.15</span>
      <button class="cfg-btn" onclick="adjustParam('speed', -0.1)">-</button>
      <button class="cfg-btn" onclick="adjustParam('speed', 0.1)">+</button>
    </div>
    <div style="text-align: right; margin-top: 10px;">
      <button class="game-btn" onclick="toggleConfigPanel()">閉じる</button>
    </div>
  </div>

  <canvas id="gameCanvas" width="640" height="640"></canvas>
  <div class="scanlines"></div>
</div>

<div id="instructions">
  [ PC操作 ]: <span>WASD / 矢印キー</span> (移動) | <span>N / M / スペース</span> (発射・帰還) | <span>ESC</span> (ポーズ)<br>
  [ スマホ操作 ]: <span>左半分ドラッグ</span> (移動) | <span>右半分タップ</span> (発射・帰還)
</div>

<audio id="bgmAudio" src="Ravel-Borelo.mp3" loop preload="auto"></audio>

<script>
// ============================================================================
// 1. 調整用パラメータ定義 (CONFIG)
// ============================================================================
const CONFIG = {
  CANVAS_WIDTH: 640,
  CANVAS_HEIGHT: 640,
  
  SCROLL_SPEED: 0.45,
  
  PLAYER_RADIUS: 70,
  PLAYER_SPEED: 3.2,
  
  FORCE_RADIUS: 22,
  FORCE_LAUNCH_SPEED: 7.2,
  FORCE_RETURN_SPEED: 7.2,
  FORCE_BOUNCE_OFFSET: 15,
  FORCE_DAMAGE_FRAME: 2.2,
  FORCE_DAMAGE_BODY: 0.8,
  
  ENEMY_RADIUS: 18,
  FLYER_SPEED_BASE: 1.15,
  
  BOSS_CORE_CYCLE: 160,
  BOSS_CORE_OPEN_TIME: 90,
  BOSS_MAX_HP: 6000,
  
  MASTER_VOLUME: 0.22,
  
  COLOR_BG: "#0f1020",
  COLOR_PLAYER: "#e0e6ed",
  COLOR_PLAYER_CORE: "#54a0ff",
  COLOR_IRON_LIGHT: "#eceff1",
  COLOR_IRON_BASE: "#78909c",
  COLOR_IRON_DARK: "#37474f",
  COLOR_HUD_TEXT: "#54a0ff"
};

let spawnIntervalSetting = 70;

function toggleConfigPanel() {
  const panel = document.getElementById("config-panel");
  panel.style.display = panel.style.display === "none" ? "block" : "none";
}

function adjustParam(type, amount) {
  if (type === 'spawn') {
    spawnIntervalSetting = Math.max(20, Math.min(300, spawnIntervalSetting + amount));
    document.getElementById("val-spawn").textContent = spawnIntervalSetting;
  } else if (type === 'speed') {
    CONFIG.FLYER_SPEED_BASE = Math.max(0.2, Math.min(3.0, Math.round((CONFIG.FLYER_SPEED_BASE + amount) * 10) / 10));
    document.getElementById("val-speed").textContent = CONFIG.FLYER_SPEED_BASE;
  }
}

document.getElementById("cfgBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  toggleConfigPanel();
});

// ============================================================================
// 2. 音響・BGMシステム
// ============================================================================
class SoundSystem {
  constructor() {
    this.ctx = null;
    this.bgmAudio = document.getElementById("bgmAudio");
    if (this.bgmAudio) {
      this.bgmAudio.volume = 0.35;
    }
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        this.ctx = new AudioCtx();
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
    this.playBGM();
  }

  playBGM() {
    if (this.bgmAudio) {
      this.bgmAudio.play().catch(err => {
        console.log("BGM autoplay waiting user interaction:", err);
      });
    }
  }

  stopBGM() {
    if (this.bgmAudio) {
      this.bgmAudio.pause();
      this.bgmAudio.currentTime = 0;
    }
  }

  playLaunch() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(520, t);
    osc.frequency.exponentialRampToValueAtTime(110, t + 0.16);
    gain.gain.setValueAtTime(CONFIG.MASTER_VOLUME * 0.9, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.16);
  }

  playDock() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc1 = this.ctx.createOscillator();
    const gain1 = this.ctx.createGain();
    osc1.type = 'square';
    osc1.frequency.setValueAtTime(880, t);
    osc1.frequency.exponentialRampToValueAtTime(440, t + 0.05);
    gain1.gain.setValueAtTime(CONFIG.MASTER_VOLUME * 0.6, t);
    gain1.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    osc1.connect(gain1);
    gain1.connect(this.ctx.destination);
    osc1.start(t);
    osc1.stop(t + 0.05);
  }

  playGet() {
    if (!this.ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      const t = this.ctx.currentTime + idx * 0.045;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(CONFIG.MASTER_VOLUME * 0.8, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.12);
    });
  }

  playEnemyDestroy() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const bufferSize = this.ctx.sampleRate * 0.15;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1000, t);
    filter.frequency.exponentialRampToValueAtTime(120, t + 0.14);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(CONFIG.MASTER_VOLUME * 1.1, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start(t);
    noise.stop(t + 0.15);
  }

  playPlayerDeath() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const bufferSize = this.ctx.sampleRate * 0.8;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(600, t);
    filter.frequency.exponentialRampToValueAtTime(50, t + 0.75);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(CONFIG.MASTER_VOLUME * 1.8, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.75);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start(t);
    noise.stop(t + 0.8);
  }

  playPierceTick() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(700 + Math.random() * 200, t);
    osc.frequency.exponentialRampToValueAtTime(200, t + 0.03);
    gain.gain.setValueAtTime(CONFIG.MASTER_VOLUME * 0.45, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.03);
  }
}

const sounds = new SoundSystem();

// ============================================================================
// 3. ゲーム本体変数・オブジェクト
// ============================================================================
const container = document.getElementById("game-container");
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const godBtn = document.getElementById("godBtn");

const stars = Array.from({ length: 70 }, () => ({
  x: Math.random() * CONFIG.CANVAS_WIDTH,
  y: Math.random() * CONFIG.CANVAS_HEIGHT,
  speed: 0.15 + Math.random() * 0.5,
  size: 1 + Math.random() * 2.0,
  alpha: 0.3 + Math.random() * 0.7
}));

let currentWave = 1;
let waveState = "PLAYING";
let restTimer = 0;
let waveAnnouncementTimer = 0;
let waveAnnouncementText = "";

let gameState = "TITLE";
let pauseMenuSelection = 0;
let scrollX = 0;
let stageLength = 4800;
let score = 0;
let gameFrame = 0;
let nextSpawnDelay = 60;
let squadSpawnCounter = 0;
let creditFrame = 0;

let wave1SpawnedCount = 0; // 💡Wave1で生成した編隊の数（全3編隊）
let carrierCounter = 0;     // 💡スピードアップの4回に1回カウント用

let isInvincible = false;

function toggleGodMode() {
  isInvincible = !isInvincible;
  godBtn.textContent = isInvincible ? "GOD: ON" : "GOD: OFF";
  godBtn.style.borderColor = isInvincible ? "#ff6b81" : "#54a0ff";
  godBtn.style.color = isInvincible ? "#ff6b81" : "#54a0ff";
  addFloatingText(player.x, player.y - 35, isInvincible ? "INVINCIBLE ON" : "INVINCIBLE OFF");
}

godBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  sounds.init();
  toggleGodMode();
});

let particles = [];
let floatingTexts = [];
let enemies = [];
let droppedItems = [];
let squads = [];
let enemyBullets = [];

const player = {
  x: 120,
  y: 320,
  vx: 0,
  vy: 0,
  radius: CONFIG.PLAYER_RADIUS,
  isDead: false,
  flameAnim: 0,
  speedBonus: 0
};

let forces = [];

const boss = {
  isActive: false,
  x: CONFIG.CANVAS_WIDTH + 180,
  y: 320,
  hp: CONFIG.BOSS_MAX_HP,
  maxHp: CONFIG.BOSS_MAX_HP,
  timer: 0,
  isCoreOpen: false,
  legAnim: 0,
  radius: 95,
  moveAngle: 0,
  dashCooldown: 0,
  isDashing: false,
  dashTargetX: 0,
  dashTargetY: 0
};

const keys = {
  up: false, down: false, left: false, right: false,
  action: false
};

let leftTouchId = null;
let leftTouchStartX = 0;
let leftTouchStartY = 0;
let playerStartX = 0;
let playerStartY = 0;
let touchActive = false;

let rightTouchId = null;
let rightTouchStartX = 0;
let rightTouchStartY = 0;
let rightTouchMoved = false;

// ============================================================================
// 4. 入力管理
// ============================================================================
container.addEventListener("contextmenu", e => e.preventDefault());

function triggerGameAction() {
  sounds.init();
  if (gameState === "TITLE") {
    startGame();
    return;
  }
  if (gameState === "GAMEOVER") {
    startGame();
    return;
  }
  if (gameState === "CREDITS") {
    if (creditFrame >= 300) {
      gameState = "TITLE";
    }
    return;
  }
  if (gameState === "PAUSE") {
    if (pauseMenuSelection === 0) {
      gameState = "PLAYING";
    } else {
      sounds.stopBGM();
      gameState = "TITLE";
    }
    return;
  }
  handleForceAction();
}

container.addEventListener("mousedown", (e) => {
  if (e.target.closest('#config-panel') || e.target === godBtn || e.target.id === 'cfgBtn') return;
  e.preventDefault();
  window.focus();
  triggerGameAction();
});

canvas.addEventListener("touchstart", (e) => {
  sounds.init();
  if (gameState === "TITLE" || gameState === "GAMEOVER" || (gameState === "CREDITS" && creditFrame >= 300)) {
    e.preventDefault();
    triggerGameAction();
    return;
  }
  if (gameState === "CREDITS" && creditFrame < 300) {
    e.preventDefault();
    return;
  }
  if (gameState === "PAUSE") {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const scaleY = canvas.height / rect.height;
    const ty = (e.changedTouches[0].clientY - rect.top) * scaleY;
    if (ty < 340) pauseMenuSelection = 0;
    else pauseMenuSelection = 1;
    triggerGameAction();
    return;
  }

  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const tx = (t.clientX - rect.left) * scaleX;
    const ty = (t.clientY - rect.top) * scaleY;

    if (tx < CONFIG.CANVAS_WIDTH / 2) {
      if (leftTouchId === null) {
        leftTouchId = t.identifier;
        leftTouchStartX = tx;
        leftTouchStartY = ty;
        playerStartX = player.x;
        playerStartY = player.y;
        touchActive = true;
      }
    } else {
      if (rightTouchId === null) {
        rightTouchId = t.identifier;
        rightTouchStartX = tx;
        rightTouchStartY = ty;
        rightTouchMoved = false;
      }
    }
  }
}, { passive: false });

canvas.addEventListener("touchmove", (e) => {
  if (gameState !== "PLAYING") return;

  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const tx = (t.clientX - rect.left) * scaleX;
    const ty = (t.clientY - rect.top) * scaleY;

    if (t.identifier === leftTouchId) {
      const dx = tx - leftTouchStartX;
      const dy = ty - leftTouchStartY;
      const targetX = Math.max(player.radius, Math.min(CONFIG.CANVAS_WIDTH - player.radius, playerStartX + dx));
      const targetY = Math.max(player.radius, Math.min(CONFIG.CANVAS_HEIGHT - player.radius, playerStartY + dy));
      
      player.vx = targetX - player.x;
      player.vy = targetY - player.y;
      player.x = targetX;
      player.y = targetY;
      touchActive = true;
    } else if (t.identifier === rightTouchId) {
      const dist = Math.hypot(tx - rightTouchStartX, ty - rightTouchStartY);
      if (dist > 14) rightTouchMoved = true;
    }
  }
}, { passive: false });

canvas.addEventListener("touchend", (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === leftTouchId) {
      leftTouchId = null;
      touchActive = false;
      player.vx = 0;
      player.vy = 0;
    } else if (t.identifier === rightTouchId) {
      if (!rightTouchMoved && gameState === "PLAYING") {
        e.preventDefault();
        handleForceAction();
      }
      rightTouchId = null;
    }
  }
}, { passive: false });

canvas.addEventListener("touchcancel", (e) => {
  leftTouchId = null;
  rightTouchId = null;
  touchActive = false;
  player.vx = 0;
  player.vy = 0;
}, { passive: false });

function isUpKey(e) {
  const k = (e.key || "").toLowerCase();
  return e.code === "ArrowUp" || e.code === "KeyW" || k === "w";
}
function isDownKey(e) {
  const k = (e.key || "").toLowerCase();
  return e.code === "ArrowDown" || e.code === "KeyS" || k === "s";
}
function isLeftKey(e) {
  const k = (e.key || "").toLowerCase();
  return e.code === "ArrowLeft" || e.code === "KeyA" || k === "a";
}
function isRightKey(e) {
  const k = (e.key || "").toLowerCase();
  return e.code === "ArrowRight" || e.code === "KeyD" || k === "d";
}
function isActionKey(e) {
  const k = (e.key || "").toLowerCase();
  return e.code === "KeyN" || e.code === "KeyM" || e.code === "Space" || k === "n" || k === "m" || k === " ";
}

window.addEventListener("keydown", (e) => {
  let handled = false;
  sounds.init();

  if (e.code === "Escape" || (e.key || "").toLowerCase() === "escape") {
    if (gameState === "PLAYING") {
      gameState = "PAUSE";
      pauseMenuSelection = 0;
      handled = true;
    } else if (gameState === "PAUSE") {
      gameState = "PLAYING";
      handled = true;
    }
  }

  if (gameState === "PAUSE") {
    if (isUpKey(e) || isDownKey(e)) {
      pauseMenuSelection = 1 - pauseMenuSelection;
      handled = true;
    }
    if (isActionKey(e) || e.code === "Enter") {
      if (pauseMenuSelection === 1) {
        sounds.stopBGM();
        gameState = "TITLE";
      } else {
        gameState = "PLAYING";
      }
      handled = true;
    }
    if (handled) { e.preventDefault(); return; }
  }

  if (gameState === "CREDITS" && creditFrame < 300) {
    e.preventDefault();
    return;
  }

  if (gameState === "TITLE" || gameState === "GAMEOVER" || gameState === "CREDITS") {
    if (isUpKey(e) || isDownKey(e) || isLeftKey(e) || isRightKey(e) || isActionKey(e) || e.code === "Enter") {
      triggerGameAction();
      handled = true;
    }
  }

  if (isUpKey(e)) { keys.up = true; handled = true; }
  if (isDownKey(e)) { keys.down = true; handled = true; }
  if (isLeftKey(e)) { keys.left = true; handled = true; }
  if (isRightKey(e)) { keys.right = true; handled = true; }

  if (e.code === "KeyI" || (e.key || "").toLowerCase() === "i") {
    toggleGodMode();
    handled = true;
  }

  if (isActionKey(e)) {
    if (!keys.action && gameState === "PLAYING") {
      handleForceAction();
    }
    keys.action = true;
    handled = true;
  }
  if (e.code === "Enter") handled = true;

  if (handled) e.preventDefault();
});

window.addEventListener("keyup", (e) => {
  if (isUpKey(e)) keys.up = false;
  if (isDownKey(e)) keys.down = false;
  if (isLeftKey(e)) keys.left = false;
  if (isRightKey(e)) keys.right = false;
  if (isActionKey(e)) keys.action = false;
});

// ============================================================================
// 5. ステージ初期化＆開始
// ============================================================================
function createForceObject(id, parentType, parentId, contactAngle) {
  return {
    id: id,
    state: "ATTACHED",
    parentType: parentType,
    parentId: parentId,
    contactAngle: contactAngle,
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    radius: CONFIG.FORCE_RADIUS,
    rollAngle: 0
  };
}

function startGame() {
  currentWave = 1;
  waveState = "PLAYING";
  restTimer = 0;
  score = 0;
  gameFrame = 0;
  scrollX = 0;
  nextSpawnDelay = 60;
  squadSpawnCounter = 0;
  wave1SpawnedCount = 0;
  carrierCounter = 0;
  particles = [];
  floatingTexts = [];
  enemies = [];
  droppedItems = [];
  squads = [];
  enemyBullets = [];

  player.x = 120;
  player.y = 320;
  player.speedBonus = 0;
  player.isDead = false;

  boss.hp = boss.maxHp = CONFIG.BOSS_MAX_HP;
  boss.x = CONFIG.CANVAS_WIDTH + 180;
  boss.y = 320;
  boss.isActive = false;
  boss.timer = 0;
  boss.isCoreOpen = false;
  boss.isDashing = false;

  triggerAnnouncement("WAVE 1");

  forces = [];
  const initialAngle = 0;
  const initialForce = createForceObject(1, "PLAYER", null, initialAngle);
  forces.push(initialForce);

  updateAllForcePositions();
  sounds.playBGM();
  gameState = "PLAYING";
}

function triggerAnnouncement(text) {
  waveAnnouncementText = text;
  waveAnnouncementTimer = 120;
}

// ============================================================================
// 6. 鉄球フォース制御
// ============================================================================
function handleForceAction() {
  if (player.isDead || gameState !== "PLAYING") return;

  const attachedForces = forces.filter(f => f.state === "ATTACHED").sort((a, b) => a.id - b.id);

  if (attachedForces.length > 0) {
    const targetForce = attachedForces[0];
    targetForce.state = "LAUNCHING";

    const dirX = Math.cos(targetForce.contactAngle);
    const dirY = Math.sin(targetForce.contactAngle);

    targetForce.vx = dirX * CONFIG.FORCE_LAUNCH_SPEED;
    targetForce.vy = dirY * CONFIG.FORCE_LAUNCH_SPEED;

    sounds.playLaunch();
    createExplosion(targetForce.x, targetForce.y, CONFIG.COLOR_IRON_LIGHT, 8);
    addFloatingText(targetForce.x, targetForce.y - 14, `LAUNCH #${targetForce.id}`);
  } else {
    let anyReturning = false;
    forces.forEach(f => {
      if (f.state !== "ATTACHED") {
        f.state = "RETURNING";
        anyReturning = true;
      }
    });
    if (anyReturning) {
      sounds.playLaunch();
      addFloatingText(player.x, player.y - 30, "RECALL ALL");
    }
  }
}

function updateAllForcePositions() {
  const attached = forces.filter(f => f.state === "ATTACHED").sort((a, b) => a.id - b.id);
  const groups = {};
  attached.forEach(f => {
    const angleKey = Math.round(f.contactAngle * 10) / 10;
    if (!groups[angleKey]) groups[angleKey] = [];
    groups[angleKey].push(f);
  });

  Object.values(groups).forEach(group => {
    group.sort((a, b) => a.id - b.id);
    group.forEach((f, idx) => {
      const dist = player.radius + f.radius + (idx * (f.radius * 2));
      f.x = player.x + Math.cos(f.contactAngle) * dist;
      f.y = player.y + Math.sin(f.contactAngle) * dist;
    });
  });
}

function updateForces() {
  forces.forEach(f => {
    f.rollAngle += (f.state === "ATTACHED" ? 0.02 : (f.state === "STAYING" ? 0.03 : 0.08));

    if (f.state === "LAUNCHING") {
      f.x += f.vx;
      f.y += f.vy;

      let hitBoundary = false;

      if (f.x > CONFIG.CANVAS_WIDTH - f.radius) {
        f.x = CONFIG.CANVAS_WIDTH - f.radius - CONFIG.FORCE_BOUNCE_OFFSET;
        hitBoundary = true;
      } else if (f.x < f.radius) {
        f.x = f.radius + CONFIG.FORCE_BOUNCE_OFFSET;
        hitBoundary = true;
      }
      if (f.y > CONFIG.CANVAS_HEIGHT - f.radius) {
        f.y = CONFIG.CANVAS_HEIGHT - f.radius - CONFIG.FORCE_BOUNCE_OFFSET;
        hitBoundary = true;
      } else if (f.y < f.radius) {
        f.y = f.radius + CONFIG.FORCE_BOUNCE_OFFSET;
        hitBoundary = true;
      }

      if (hitBoundary) {
        f.state = "STAYING";
        f.vx = 0;
        f.vy = 0;
        createExplosion(f.x, f.y, CONFIG.COLOR_IRON_LIGHT, 6);
        addFloatingText(f.x, f.y - 14, `STAY #${f.id}`);
      }
    } else if (f.state === "STAYING") {
      const distToPlayer = Math.hypot(player.x - f.x, player.y - f.y);
      if (distToPlayer <= player.radius + f.radius + 3) {
        f.parentType = "PLAYER";
        f.parentId = null;
        f.contactAngle = Math.atan2(f.y - player.y, f.x - player.x);
        f.state = "ATTACHED";
        sounds.playDock();
        createExplosion(f.x, f.y, CONFIG.COLOR_IRON_LIGHT, 10);
        addFloatingText(f.x, f.y - 16, `DOCK #${f.id}`);
      }
    } else if (f.state === "RETURNING") {
      const dx = player.x - f.x;
      const dy = player.y - f.y;
      const dist = Math.hypot(dx, dy);

      if (dist > 4) {
        f.x += (dx / dist) * CONFIG.FORCE_RETURN_SPEED;
        f.y += (dy / dist) * CONFIG.FORCE_RETURN_SPEED;
      }

      const distToPlayer = Math.hypot(player.x - f.x, player.y - f.y);
      if (distToPlayer <= player.radius + f.radius + 3) {
        f.parentType = "PLAYER";
        f.parentId = null;
        f.contactAngle = Math.atan2(f.y - player.y, f.x - player.x);
        f.state = "ATTACHED";
        sounds.playDock();
        createExplosion(f.x, f.y, CONFIG.COLOR_IRON_LIGHT, 10);
        addFloatingText(f.x, f.y - 16, `DOCK #${f.id}`);
      }
    }
  });

  updateAllForcePositions();
}

// ============================================================================
// 7. 6ウェーブ制 ＆ アイテム・敵管理
// ============================================================================
function updateSquadSpawning() {
  if (boss.isActive || gameState !== "PLAYING") return;

  const progressRatio = scrollX / stageLength;
  
  let targetWave = 1;
  if (progressRatio >= 0.16 && progressRatio < 0.33) targetWave = 2;
  else if (progressRatio >= 0.33 && progressRatio < 0.50) targetWave = 3;
  else if (progressRatio >= 0.50 && progressRatio < 0.66) targetWave = 4;
  else if (progressRatio >= 0.66 && progressRatio < 0.83) targetWave = 5;
  else if (progressRatio >= 0.83 && progressRatio < 0.96) targetWave = 6;

  if (currentWave !== targetWave) {
    if (waveState === "PLAYING") {
      triggerWaveRest(targetWave);
    }
  }

  if (waveState === "REST") {
    restTimer--;
    if (restTimer <= 0) {
      waveState = "PLAYING";
      triggerAnnouncement(`WAVE ${currentWave}`);
    }
    return;
  }

  // 💡Wave 1専用の厳密なスポーン処理（最初の2編隊はみどり＝FORCE_CARRIER、3つ目はノーマル、合計3編隊）
  if (currentWave === 1) {
    if (wave1SpawnedCount < 3) {
      nextSpawnDelay--;
      if (nextSpawnDelay <= 0) {
        nextSpawnDelay = 180; // ゆったり
        let enemyType = "NORMAL";
        if (wave1SpawnedCount === 0 || wave1SpawnedCount === 1) {
          enemyType = "FORCE_CARRIER"; // 最初の2編隊は必ず緑（鉄球）
        }
        squads.push({
          id: Date.now() + Math.random(),
          total: 10,
          remaining: 10,
          lastSpawnFrame: gameFrame,
          spawnedCount: 0,
          startX: CONFIG.CANVAS_WIDTH + 24,
          startY: 120 + Math.random() * (CONFIG.CANVAS_HEIGHT - 240),
          patternType: "STRAIGHT", // Wave 1は常に直線
          enemyType: enemyType
        });
        wave1SpawnedCount++;
      }
    }
    return;
  }

  // 💡Wave 2〜6のスポーン処理
  // Wave 2, 3は敵の数を半分にするため、出現間隔を倍に＆編隊数も5機にする
  let effectiveDelay = spawnIntervalSetting;
  if (currentWave === 2) effectiveDelay = 220;
  else if (currentWave === 3) effectiveDelay = 180;
  else if (currentWave >= 4) effectiveDelay = Math.max(35, spawnIntervalSetting - (currentWave * 8));

  nextSpawnDelay--;
  if (nextSpawnDelay <= 0) {
    nextSpawnDelay = effectiveDelay;
    squadSpawnCounter++;

    const squadId = Date.now() + Math.random();
    let patternType = "WAVE_BIG";
    let startX = CONFIG.CANVAS_WIDTH + 24;
    let startY = 120 + Math.random() * (CONFIG.CANVAS_HEIGHT - 240);

    // 💡Wave 3〜6は直線（STRAIGHT）をしっかり混ぜる（40%の確率で直線）
    const randPattern = Math.random();
    if (currentWave === 4) {
      startX = 100 + Math.random() * (CONFIG.CANVAS_WIDTH - 200);
      startY = -24;
      patternType = "VERTICAL_DOWN";
    } else if (currentWave === 5) {
      startX = 100 + Math.random() * (CONFIG.CANVAS_WIDTH - 200);
      startY = CONFIG.CANVAS_HEIGHT + 24;
      patternType = "VERTICAL_UP";
    } else if (currentWave === 6) {
      const randDir = Math.random();
      if (randDir < 0.33) { startX = CONFIG.CANVAS_WIDTH + 24; startY = Math.random() * CONFIG.CANVAS_HEIGHT; patternType = "WAVE_BIG"; }
      else if (randDir < 0.66) { startX = Math.random() * CONFIG.CANVAS_WIDTH; startY = -24; patternType = "VERTICAL_DOWN"; }
      else { startX = Math.random() * CONFIG.CANVAS_WIDTH; startY = CONFIG.CANVAS_HEIGHT + 24; patternType = "VERTICAL_UP"; }
    } else {
      // Wave 2, 3, その他: 直線を40%混ぜる
      patternType = randPattern < 0.4 ? "STRAIGHT" : (Math.random() < 0.5 ? "WAVE_BIG" : "WAVE_SMALL");
    }

    // 💡スピードアップは「4回に1回程度」のカウント制 (carrierCounter % 4 === 0)
    let enemyType = "NORMAL";
    if (currentWave >= 2) {
      const r = Math.random();
      if (r < 0.15) {
        enemyType = "FORCE_CARRIER"; // 緑（鉄球）
      } else {
        carrierCounter++;
        if (carrierCounter % 4 === 0) {
          enemyType = "SPEED_CARRIER"; // 黄色（4回に1回確実にスピードアップキャリア）
        }
      }
    }

    // 💡Wave 2, 3は敵の数を今の半分（5機）にする
    const squadTotal = (currentWave === 2 || currentWave === 3) ? 5 : 10;

    squads.push({
      id: squadId,
      total: squadTotal,
      remaining: squadTotal,
      lastSpawnFrame: gameFrame,
      spawnedCount: 0,
      startX: startX,
      startY: startY,
      patternType: patternType,
      enemyType: enemyType
    });
  }

  for (let s of squads) {
    const delay = 22;
    if (s.spawnedCount < s.total && (gameFrame - s.lastSpawnFrame) >= delay) {
      s.lastSpawnFrame = gameFrame;
      s.spawnedCount++;

      enemies.push({
        squadId: s.id,
        isSquadMember: true,
        x: s.startX,
        y: s.startY,
        baseX: s.startX,
        baseY: s.startY,
        spawnIndex: s.spawnedCount, // 💡同じルートをトレースするためのインデックス
        patternType: s.patternType,
        enemyType: s.enemyType,
        hpVal: s.enemyType !== "NORMAL" ? 3.0 : 2.0,
        scoreVal: s.enemyType !== "NORMAL" ? 250 : 100,
        radius: s.enemyType !== "NORMAL" ? 21 : CONFIG.ENEMY_RADIUS
      });
    }
  }

  squads = squads.filter(s => s.remaining > 0);
}

function triggerWaveRest(nextWaveNum) {
  waveState = "REST";
  restTimer = 120;
  currentWave = nextWaveNum;
  triggerAnnouncement(`REST / WAVE ${nextWaveNum}`);
}

function updateEnemies() {
  updateSquadSpawning();
  const currentSpeed = CONFIG.FLYER_SPEED_BASE;

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];

    // 💡X座標ベースでサインカーブを計算し、後から来る敵も先頭と同じルートを完全再現（待ち伏せ可能）
    const distanceTraveled = (CONFIG.CANVAS_WIDTH + 50) - e.x + (e.spawnIndex * 28);

    if (e.patternType === "WAVE_BIG") {
      e.x -= currentSpeed * 1.2;
      e.y = e.baseY + Math.sin(distanceTraveled * 0.035) * 95;
    } else if (e.patternType === "WAVE_SMALL") {
      e.x -= currentSpeed * 1.4;
      e.y = e.baseY + Math.sin(distanceTraveled * 0.05) * 32;
    } else if (e.patternType === "STRAIGHT") {
      e.x -= currentSpeed * 1.6;
    } else if (e.patternType === "VERTICAL_DOWN") {
      e.y += currentSpeed * 1.4;
      e.x = e.baseX + Math.sin(distanceTraveled * 0.035) * 45;
    } else if (e.patternType === "VERTICAL_UP") {
      e.y -= currentSpeed * 1.4;
      e.x = e.baseX + Math.sin(distanceTraveled * 0.035) * 45;
    }

    if (e.x < -80 || e.x > CONFIG.CANVAS_WIDTH + 80 || e.y > CONFIG.CANVAS_HEIGHT + 80 || e.y < -80) {
      enemies.splice(i, 1);
      continue;
    }

    for (let f of forces) {
      const distToForce = Math.hypot(e.x - f.x, e.y - f.y);
      if (distToForce < f.radius + e.radius) {
        e.hpVal -= 2.5;
        createExplosion(e.x, e.y, CONFIG.COLOR_IRON_LIGHT, 4);
        if (e.hpVal <= 0) {
          destroyEnemy(i, e);
          break;
        }
      }
    }

    const distToPlayer = Math.hypot(e.x - player.x, e.y - player.y);
    if (!isInvincible && distToPlayer < player.radius + e.radius - 8) {
      killPlayer();
      break;
    }
  }

  for (let i = droppedItems.length - 1; i >= 0; i--) {
    const item = droppedItems[i];
    
    if (item.stage === "DASHING") {
      const dx = item.targetX - item.x;
      const dy = item.targetY - item.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 5) {
        item.x += (dx / dist) * 18.0;
        item.y += (dy / dist) * 18.0;
      } else {
        item.stage = "SCROLLING";
      }
    } else {
      item.x -= CONFIG.SCROLL_SPEED;
    }

    if (item.x < -60 || item.x > CONFIG.CANVAS_WIDTH + 60) {
      droppedItems.splice(i, 1);
      continue;
    }

    const distToPlayer = Math.hypot(item.x - player.x, item.y - player.y);
    if (distToPlayer < player.radius + item.radius + 6) {
      if (item.itemType === "SPEED_UP") {
        player.speedBonus = Math.min(2.5, player.speedBonus + 0.4);
        score += 1000;
        sounds.playGet();
        createExplosion(item.x, item.y, "#ffe600", 25);
        addFloatingText(player.x, player.y - 50, "SPEED UP !!");
      } else {
        const newId = forces.length + 1;
        const newForce = createForceObject(newId, "PLAYER", null, Math.PI);
        newForce.x = item.x;
        newForce.y = item.y;
        newForce.state = "RETURNING";
        forces.push(newForce);

        score += 1500;
        sounds.playGet();
        createExplosion(item.x, item.y, "#54a0ff", 30);
        addFloatingText(player.x, player.y - 50, `FORCE GET !! (#${newId})`);
      }
      droppedItems.splice(i, 1);
    }
  }

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx;
    b.y += b.vy;

    if (b.x < -20 || b.x > CONFIG.CANVAS_WIDTH + 20 || b.y < -20 || b.y > CONFIG.CANVAS_HEIGHT + 20) {
      enemyBullets.splice(i, 1);
      continue;
    }

    if (!isInvincible && Math.hypot(b.x - player.x, b.y - player.y) < player.radius + b.radius - 6) {
      killPlayer();
      break;
    }
  }
}

function destroyEnemy(index, e) {
  sounds.playEnemyDestroy();
  createExplosion(e.x, e.y, e.enemyType !== "NORMAL" ? "#2ed573" : "#ff6b81", 16);
  addFloatingText(e.x, e.y - 8, `+${e.scoreVal}`);
  score += e.scoreVal;

  if (e.isSquadMember) {
    const squad = squads.find(s => s.id === e.squadId);
    if (squad) {
      squad.remaining--;
      if (squad.remaining <= 0) {
        const targetEdgeX = 350 + Math.random() * 220;
        const targetEdgeY = 60 + Math.random() * (CONFIG.CANVAS_HEIGHT - 120);

        if (e.enemyType === "FORCE_CARRIER") {
          const nextNum = forces.length + 1;
          droppedItems.push({
            x: e.x,
            y: e.y,
            targetX: targetEdgeX,
            targetY: targetEdgeY,
            stage: "DASHING",
            itemType: "FORCE",
            nextId: nextNum,
            radius: CONFIG.FORCE_RADIUS
          });
          sounds.playGet();
          addFloatingText(e.x, e.y - 24, `FORCE DROP #${nextNum}!`);
        } else if (e.enemyType === "SPEED_CARRIER") {
          droppedItems.push({
            x: e.x,
            y: e.y,
            targetX: targetEdgeX,
            targetY: targetEdgeY,
            stage: "DASHING",
            itemType: "SPEED_UP",
            radius: CONFIG.FORCE_RADIUS
          });
          sounds.playGet();
          addFloatingText(e.x, e.y - 24, "SPEED UP DROP!");
        }
      }
    }
  }

  enemies.splice(index, 1);
}

// ============================================================================
// 8. 巨大ボス戦
// ============================================================================
function updateBoss() {
  if (!boss.isActive && scrollX >= stageLength) {
    boss.isActive = true;
    sounds.playGet();
    addFloatingText(CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2, "WARNING: ULTIMATE BIO BOSS");
  }

  if (!boss.isActive) return;

  boss.timer++;
  boss.legAnim += 0.08;

  boss.moveAngle += 0.025;
  if (!boss.isDashing) {
    boss.x = CONFIG.CANVAS_WIDTH - 150 + Math.sin(boss.moveAngle) * 40;
    boss.y = 320 + Math.cos(boss.moveAngle * 1.5) * 160;

    if (boss.timer % 220 === 0) {
      boss.isDashing = true;
      boss.dashTargetX = 150 + Math.random() * 350;
      boss.dashTargetY = 100 + Math.random() * 440;
    }
  } else {
    const dx = boss.dashTargetX - boss.x;
    const dy = boss.dashTargetY - boss.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 8) {
      boss.x += (dx / dist) * 7.0;
      boss.y += (dy / dist) * 7.0;
    } else {
      boss.isDashing = false;
    }
  }

  if (boss.timer % 70 === 0) {
    const angleToPlayer = Math.atan2(player.y - boss.y, player.x - boss.x);
    for (let offset of [-0.3, 0, 0.3]) {
      enemyBullets.push({
        x: boss.x - 45,
        y: boss.y,
        vx: Math.cos(angleToPlayer + offset) * 4.2,
        vy: Math.sin(angleToPlayer + offset) * 4.2,
        radius: 6
      });
    }
  }

  const cycleFrame = boss.timer % CONFIG.BOSS_CORE_CYCLE;
  boss.isCoreOpen = (cycleFrame > (CONFIG.BOSS_CORE_CYCLE - CONFIG.BOSS_CORE_OPEN_TIME));

  const bossDrawX = boss.x;
  const bossDrawY = boss.y;
  
  const coreX = bossDrawX - 45;
  const coreY = bossDrawY;

  let totalFrameDamage = 0;
  forces.forEach(f => {
    const distToCore = Math.hypot(f.x - coreX, f.y - coreY);
    if (distToCore < 38 + f.radius) {
      if (boss.isCoreOpen) {
        totalFrameDamage += CONFIG.FORCE_DAMAGE_FRAME * 2.2;
        if (gameFrame % 3 === 0) sounds.playPierceTick();
        createExplosion(coreX + (Math.random()-0.5)*25, coreY + (Math.random()-0.5)*25, "#ff6b81", 4);
      } else {
        totalFrameDamage += CONFIG.FORCE_DAMAGE_BODY * 0.5;
        createExplosion(f.x, f.y, "#90a4ae", 1);
      }
    } else {
      const distToBody = Math.hypot(f.x - bossDrawX, f.y - bossDrawY);
      if (distToBody < boss.radius + f.radius) {
        totalFrameDamage += CONFIG.FORCE_DAMAGE_BODY;
        createExplosion(f.x, f.y, "#ff6b81", 1);
      }
    }
  });

  if (totalFrameDamage > 0) {
    boss.hp -= totalFrameDamage;
    if (boss.isCoreOpen && gameFrame % 18 === 0) {
      addFloatingText(coreX, coreY - 30, "CRITICAL CORE HIT!");
    }
    checkBossDefeat(bossDrawX, bossDrawY);
  }

  if (!isInvincible && Math.hypot(player.x - bossDrawX, player.y - bossDrawY) < player.radius + boss.radius - 20) {
    killPlayer();
  }
}

function checkBossDefeat(bx, by) {
  if (boss.hp <= 0 && gameState === "PLAYING") {
    boss.hp = 0;
    sounds.playEnemyDestroy();
    for (let i = 0; i < 120; i++) {
      createExplosion(bx + (Math.random()-0.5)*200, by + (Math.random()-0.5)*200, "#ff6b81", 5);
      createExplosion(bx + (Math.random()-0.5)*200, by + (Math.random()-0.5)*200, "#ffe600", 5);
    }
    score += 100000;
    sounds.stopBGM();
    gameState = "CREDITS";
    creditFrame = 0;
  }
}

function killPlayer() {
  if (player.isDead || isInvincible) return;
  player.isDead = true;
  sounds.playEnemyDestroy();
  sounds.stopBGM();
  sounds.playPlayerDeath();
  
  for (let i = 0; i < 4; i++) {
    setTimeout(() => {
      createExplosion(player.x + (Math.random()-0.5)*40, player.y + (Math.random()-0.5)*40, "#ff6b81", 20);
    }, i * 400);
  }

  gameState = "DYING";
  deathTimer = 180;
}

// ============================================================================
// 9. 自機移動＆スクロール更新
// ============================================================================
function movePlayer() {
  let moveX = 0, moveY = 0;
  if (keys.up) moveY -= 1;
  if (keys.down) moveY += 1;
  if (keys.left) moveX -= 1;
  if (keys.right) moveX += 1;

  if (moveX !== 0 && moveY !== 0) {
    moveX *= 0.7071;
    moveY *= 0.7071;
  }

  const actualSpeed = CONFIG.PLAYER_SPEED + player.speedBonus;

  if (!touchActive) {
    player.vx = moveX * actualSpeed;
    player.vy = moveY * actualSpeed;
    player.x += player.vx;
    player.y += player.vy;
  }

  player.x = Math.max(player.radius, Math.min(CONFIG.CANVAS_WIDTH - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(CONFIG.CANVAS_HEIGHT - player.radius, player.y));
  
  if (Math.abs(player.vx) > 0.1 || Math.abs(player.vy) > 0.1) {
    player.flameAnim = (player.flameAnim + 0.3) % (Math.PI * 2);
  }
}

function updateScroll() {
  if (!boss.isActive) {
    scrollX += CONFIG.SCROLL_SPEED;
  }
}

function createExplosion(x, y, color = "#ff6b81", count = 15) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.8 + Math.random() * 3.5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 2 + Math.random() * 4,
      color: color,
      alpha: 1.0,
      decay: 0.025 + Math.random() * 0.03
    });
  }
}

function addFloatingText(x, y, text) {
  floatingTexts.push({ x, y, text, alpha: 1.0, vy: -0.8 });
}

function update() {
  gameFrame++;

  if (waveAnnouncementTimer > 0) {
    waveAnnouncementTimer--;
  }

  if (gameState === "CREDITS") {
    creditFrame++;
  }

  stars.forEach(s => {
    s.x -= s.speed + 0.15;
    if (s.x < 0) { s.x = CONFIG.CANVAS_WIDTH; s.y = Math.random() * CONFIG.CANVAS_HEIGHT; }
  });

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy; ft.alpha -= 0.015;
    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
  }

  if (gameState === "DYING") {
    deathTimer--;
    if (deathTimer <= 0) gameState = "GAMEOVER";
    return;
  }

  if (gameState !== "PLAYING") return;

  updateScroll();
  movePlayer();
  updateForces();
  updateEnemies();
  updateBoss();
}

// ============================================================================
// 10. 描画処理 (Render)
// ============================================================================
function drawPlayer(x, y) {
  if (player.isDead && gameState !== "DYING") return;
  ctx.save();
  ctx.translate(x, y);

  if (gameState !== "DYING") {
    let moveAngle = Math.PI;
    const speedSq = player.vx * player.vx + player.vy * player.vy;
    if (speedSq > 0.01) {
      moveAngle = Math.atan2(player.vy, player.vx) + Math.PI;
    }

    const flameLen = 18 + Math.sin(player.flameAnim) * 8;
    ctx.save();
    ctx.rotate(moveAngle);
    ctx.fillStyle = "#ff6b81";
    ctx.beginPath();
    ctx.moveTo(player.radius - 4, -12);
    ctx.lineTo(player.radius + flameLen, 0);
    ctx.lineTo(player.radius - 4, 12);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  let playerColor = CONFIG.COLOR_PLAYER;
  if (isInvincible) {
    playerColor = (Math.floor(gameFrame / 8) % 2 === 0) ? "#ff9ff3" : "#54a0ff";
  } else if (gameState === "DYING") {
    const flashBlink = Math.floor(deathTimer / 12) % 2 === 0;
    playerColor = flashBlink ? "#ff0000" : "#ffffff";
  }

  ctx.fillStyle = playerColor;
  ctx.beginPath();
  ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
  ctx.fill();

  if (gameState !== "DYING") {
    ctx.fillStyle = CONFIG.COLOR_PLAYER_CORE;
    ctx.beginPath();
    ctx.arc(15, 0, player.radius * 0.45, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#ff9ff3";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, player.radius - 6, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
}

function drawForce(f) {
  ctx.save();
  ctx.translate(f.x, f.y);

  if (f.state === "STAYING") {
    ctx.fillStyle = "rgba(84, 160, 255, 0.22)";
    ctx.beginPath();
    ctx.arc(0, 0, f.radius + 7, 0, Math.PI * 2);
    ctx.fill();
  }

  const grad = ctx.createRadialGradient(
    -f.radius * 0.35, -f.radius * 0.35, f.radius * 0.1,
    0, 0, f.radius
  );
  grad.addColorStop(0, CONFIG.COLOR_IRON_LIGHT);
  grad.addColorStop(0.5, CONFIG.COLOR_IRON_BASE);
  grad.addColorStop(1, CONFIG.COLOR_IRON_DARK);

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, f.radius, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#ff6b81";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, f.radius * 0.7, f.rollAngle, f.rollAngle + Math.PI * 1.5);
  ctx.stroke();

  ctx.fillStyle = "#ffffff";
  ctx.shadowColor = "#000000";
  ctx.shadowBlur = 3;
  ctx.font = "bold 14px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(f.id.toString(), 0, 1);
  ctx.shadowBlur = 0;

  ctx.restore();
}

function drawEnemies() {
  enemies.forEach(e => {
    ctx.save();
    ctx.translate(e.x, e.y);

    if (e.enemyType === "FORCE_CARRIER") {
      ctx.fillStyle = "#2ed573";
      ctx.beginPath();
      ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ff6b81";
      ctx.beginPath();
      ctx.arc(0, 0, e.radius * 0.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (e.enemyType === "SPEED_CARRIER") {
      ctx.fillStyle = "#ffe600";
      ctx.beginPath();
      ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ff6b81";
      ctx.beginPath();
      ctx.arc(0, 0, e.radius * 0.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = "#ff9ff3";
      ctx.beginPath();
      ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#2d3436";
      ctx.beginPath();
      ctx.arc(-5, 0, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  });

  droppedItems.forEach(item => {
    ctx.save();
    ctx.translate(item.x, item.y);

    const flash = (Math.sin(gameFrame * 0.3) + 1) / 2;
    const isSpeed = item.itemType === "SPEED_UP";

    if (isSpeed) {
      const glowRadius = item.radius + 12 + flash * 8;
      const auraGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, glowRadius);
      auraGrad.addColorStop(0, "#ffffff");
      auraGrad.addColorStop(0.4, "#ffe600");
      auraGrad.addColorStop(1, "rgba(255, 230, 0, 0)");
      ctx.fillStyle = auraGrad;
      ctx.beginPath();
      ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 9px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("SPEED", 0, 1);
    } else {
      const glowRadius = item.radius + 12 + flash * 8;
      const auraGrad = ctx.createRadialGradient(0, 0, item.radius, 0, 0, glowRadius);
      auraGrad.addColorStop(0, "rgba(84, 160, 255, 0.8)");
      auraGrad.addColorStop(1, "rgba(84, 160, 255, 0)");
      ctx.fillStyle = auraGrad;
      ctx.beginPath();
      ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
      ctx.fill();

      const grad = ctx.createRadialGradient(-6, -6, 2, 0, 0, item.radius);
      grad.addColorStop(0, "#ffffff");
      grad.addColorStop(0.6, CONFIG.COLOR_IRON_BASE);
      grad.addColorStop(1, CONFIG.COLOR_IRON_DARK);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, item.radius + 2, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = "#54a0ff";
      ctx.font = "bold 13px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(`+${item.nextId}`, 0, 1);
    }

    ctx.restore();
  });

  enemyBullets.forEach(b => {
    ctx.save();
    ctx.fillStyle = "#ff6b81";
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  if (boss.isActive) {
    const bossDrawX = boss.x;
    const bossDrawY = boss.y;

    ctx.save();
    ctx.translate(bossDrawX, bossDrawY);

    ctx.fillStyle = "#7209b7";
    ctx.beginPath();
    ctx.ellipse(40, 0, 125, 105, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#ff6b81";
    ctx.lineWidth = 4;
    ctx.stroke();

    for (let i = 1; i <= 4; i++) {
      const legAngle = boss.legAnim + (i * Math.PI / 2);
      const tailX = 85 + i * 45 + Math.sin(legAngle) * 20;
      const tailY = Math.sin(boss.legAnim + i * 0.8) * 60;
      
      ctx.fillStyle = "#ff9ff3";
      ctx.beginPath();
      ctx.arc(tailX, tailY, 42 - i * 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#3a0ca3";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    const coreX = -45;
    const coreY = 0;

    if (boss.isCoreOpen) {
      ctx.fillStyle = "#ff6b81";
      ctx.shadowColor = "#ff6b81";
      ctx.shadowBlur = 28;
      ctx.beginPath();
      ctx.arc(coreX, coreY, 42, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(coreX, coreY, 22, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = "#3f37c9";
      ctx.beginPath();
      ctx.arc(coreX, coreY, 42, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#54a0ff";
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    ctx.restore();
  }
}

function drawHUD() {
  ctx.save();
  ctx.fillStyle = "rgba(15, 16, 32, 0.95)";
  ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, 52);
  ctx.strokeStyle = "#ff6b81";
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, CONFIG.CANVAS_WIDTH, 52);

  ctx.fillStyle = CONFIG.COLOR_HUD_TEXT;
  ctx.font = "bold 18px monospace";
  ctx.fillText(`SCORE: ${score.toString().padStart(6, "0")}`, 18, 32);

  const waveStr = waveState === "REST" ? "REST" : `WAVE ${currentWave}/6`;
  ctx.fillStyle = waveState === "REST" ? "#ffe600" : "#ff9ff3";
  ctx.fillText(waveStr, 245, 32);

  const attachedCount = forces.filter(f => f.state === "ATTACHED").length;
  ctx.fillStyle = CONFIG.COLOR_HUD_TEXT;
  ctx.fillText(`F: ${attachedCount}/${forces.length}`, 380, 32);

  if (boss.isActive) {
    const hpRatio = Math.max(0, boss.hp / boss.maxHp);
    const bW = 100, bH = 14;
    const bX = CONFIG.CANVAS_WIDTH - 110, bY = 19;
    ctx.strokeStyle = "#ff6b81";
    ctx.lineWidth = 2;
    ctx.strokeRect(bX, bY, bW, bH);
    ctx.fillStyle = "#ff6b81";
    ctx.fillRect(bX + 1, bY + 1, (bW - 2) * hpRatio, bH - 2);
  }

  ctx.restore();
}

function drawOverlay() {
  ctx.save();
  ctx.textAlign = "center";

  if (waveAnnouncementTimer > 0 && gameState === "PLAYING") {
    ctx.save();
    ctx.fillStyle = "rgba(15, 16, 32, 0.85)";
    ctx.fillRect(0, 220, CONFIG.CANVAS_WIDTH, 160);
    ctx.strokeStyle = "#ff6b81";
    ctx.lineWidth = 4;
    ctx.strokeRect(0, 220, CONFIG.CANVAS_WIDTH, 160);

    ctx.fillStyle = "#ffe600";
    ctx.shadowColor = "#ff9ff3";
    ctx.shadowBlur = 25;
    ctx.font = "bold 52px monospace";
    ctx.fillText(waveAnnouncementText, CONFIG.CANVAS_WIDTH / 2, 315);
    ctx.restore();
  }

  if (gameState === "TITLE") {
    ctx.fillStyle = "rgba(15, 16, 32, 0.95)";
    ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

    ctx.fillStyle = "#ff6b81";
    ctx.shadowColor = "#ff9ff3";
    ctx.shadowBlur = 30;
    ctx.font = "bold 72px monospace";
    ctx.fillText("ま～るタイプ", CONFIG.CANVAS_WIDTH / 2, 210);
    ctx.shadowBlur = 0;

    ctx.fillStyle = "#54a0ff";
    ctx.font = "bold 15px monospace";
    ctx.fillText("✨ 鉄球オプションがピタリと重なる新感覚シューティング ✨", CONFIG.CANVAS_WIDTH / 2, 280);

    ctx.fillStyle = "#ff6b81";
    ctx.beginPath();
    ctx.roundRect(CONFIG.CANVAS_WIDTH / 2 - 160, 320, 320, 58, 29);
    ctx.fill();
    ctx.strokeStyle = "#ffe600";
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 20px monospace";
    ctx.fillText("▶ ゲーム開始 / スタート", CONFIG.CANVAS_WIDTH / 2, 355);

    ctx.fillStyle = "#e0e6ed";
    ctx.font = "12px monospace";
    ctx.fillText("・緑: 鉄球追加 / 黄: SPEED UP / 紫: 通常敵", CONFIG.CANVAS_WIDTH / 2, 420);
    ctx.fillText("・全6ウェーブ（後半＆ボス戦は激しく変化）", CONFIG.CANVAS_WIDTH / 2, 445);

    const blink = Math.floor(Date.now() / 400) % 2 === 0;
    if (blink) {
      ctx.fillStyle = "#ffe600";
      ctx.font = "bold 16px monospace";
      ctx.fillText("[ TAP / CLICK TO PLAY ]", CONFIG.CANVAS_WIDTH / 2, 535);
    }
  } else if (gameState === "PAUSE") {
    ctx.fillStyle = "rgba(15, 16, 32, 0.88)";
    ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

    ctx.fillStyle = "#54a0ff";
    ctx.font = "bold 42px monospace";
    ctx.fillText("PAUSE", CONFIG.CANVAS_WIDTH / 2, 200);

    ctx.fillStyle = pauseMenuSelection === 0 ? "#ffe600" : "#ffffff";
    ctx.font = "bold 22px monospace";
    ctx.fillText(pauseMenuSelection === 0 ? "▶ ゲームに戻る" : "  ゲームに戻る", CONFIG.CANVAS_WIDTH / 2, 310);

    ctx.fillStyle = pauseMenuSelection === 1 ? "#ffe600" : "#ffffff";
    ctx.font = "bold 22px monospace";
    ctx.fillText(pauseMenuSelection === 1 ? "▶ タイトル画面に戻る" : "  タイトル画面に戻る", CONFIG.CANVAS_WIDTH / 2, 380);

    ctx.fillStyle = "#ff9ff3";
    ctx.font = "14px monospace";
    ctx.fillText("[ ESCキー または タップで決定 ]", CONFIG.CANVAS_WIDTH / 2, 480);
  } else if (gameState === "GAMEOVER") {
    ctx.fillStyle = "rgba(35, 10, 15, 0.9)";
    ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

    ctx.fillStyle = "#ff6b81";
    ctx.font = "bold 38px monospace";
    ctx.fillText("GAME OVER", CONFIG.CANVAS_WIDTH / 2, 240);

    ctx.fillStyle = "#54a0ff";
    ctx.font = "bold 20px monospace";
    ctx.fillText("RETRY", CONFIG.CANVAS_WIDTH / 2, 295);

    ctx.fillStyle = "#ffffff";
    ctx.font = "15px monospace";
    ctx.fillText(`FINAL SCORE: ${score}`, CONFIG.CANVAS_WIDTH / 2, 345);

    const blink = Math.floor(Date.now() / 350) % 2 === 0;
    if (blink) {
      ctx.fillStyle = "#ffe66d";
      ctx.font = "bold 16px monospace";
      ctx.fillText("[ TAP / CLICK TO RETRY ]", CONFIG.CANVAS_WIDTH / 2, 440);
    }
  } else if (gameState === "CREDITS") {
    ctx.fillStyle = "rgba(10, 20, 35, 0.96)";
    ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

    ctx.fillStyle = "#2ed573";
    ctx.font = "bold 44px monospace";
    ctx.fillText("Congratirations!!", CONFIG.CANVAS_WIDTH / 2, 160);

    ctx.fillStyle = "#ffe600";
    ctx.font = "bold 24px monospace";
    ctx.fillText("Thank you for playing!", CONFIG.CANVAS_WIDTH / 2, 250);

    ctx.fillStyle = "#54a0ff";
    ctx.font = "bold 22px monospace";
    ctx.fillText("Created by mukkii", CONFIG.CANVAS_WIDTH / 2, 350);

    ctx.fillStyle = "#ffffff";
    ctx.font = "16px monospace";
    ctx.fillText(`FINAL SCORE: ${score}`, CONFIG.CANVAS_WIDTH / 2, 430);

    if (creditFrame >= 300) {
      const blink = Math.floor(Date.now() / 400) % 2 === 0;
      if (blink) {
        ctx.fillStyle = "#ffe600";
        ctx.font = "bold 20px monospace";
        ctx.fillText("- PRESS ANY BUTTON -", CONFIG.CANVAS_WIDTH / 2, 515);
      }
    }
  }

  ctx.restore();
}

function render() {
  ctx.fillStyle = CONFIG.COLOR_BG;
  ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
  stars.forEach(s => {
    ctx.fillStyle = `rgba(200, 225, 255, ${s.alpha})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });

  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  });
  ctx.globalAlpha = 1.0;

  floatingTexts.forEach(ft => {
    ctx.save();
    ctx.fillStyle = `rgba(255, 230, 109, ${ft.alpha})`;
    ctx.font = "bold 13px monospace";
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  });

  drawEnemies();
  drawPlayer(player.x, player.y);
  forces.forEach(f => drawForce(f));
  drawHUD();
  drawOverlay();
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
